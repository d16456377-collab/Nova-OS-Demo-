/* ---------- calendar & notifications ---------- */
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

function buildCalendarPanel() {
  const panel = $('#calendarPanel');
  if (!panel) return;
  renderCalendar();
  panel.addEventListener('click', (e) => {
    const nav = e.target.closest('[data-cal]');
    if (nav) {
      calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + Number(nav.dataset.cal), 1);
      renderCalendar();
      return;
    }
    if (e.target.closest('[data-clear-notifs]')) {
      notifications = [];
      renderNotifications();
      return;
    }
    const notif = e.target.closest('[data-notif-app]');
    if (notif) {
      closePanels();
      openApp(notif.dataset.notifApp);
    }
  });
}
function renderCalendar() {
  const panel = $('#calendarPanel');
  if (!panel) return;
  const y = calCursor.getFullYear();
  const m = calCursor.getMonth();
  const now = new Date();
  const first = new Date(y, m, 1);
  const offset = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const prevMonthDays = new Date(y, m, 0).getDate();
  const cells = [];
  for (let i = 0; i < 42; i++) {
    let day;
    let kind = 'cur';
    if (i < offset) {
      day = prevMonthDays - offset + i + 1;
      kind = 'prev';
    } else if (i >= offset + daysInMonth) {
      day = i - offset - daysInMonth + 1;
      kind = 'next';
    } else {
      day = i - offset + 1;
    }
    const date = new Date(y, m + (kind === 'prev' ? -1 : kind === 'next' ? 1 : 0), day);
    const isToday = kind === 'cur' && now.getFullYear() === y && now.getMonth() === m && now.getDate() === day;
    cells.push(`<div class="cal-day ${kind !== 'cur' ? 'other' : ''} ${isToday ? 'today' : ''}">${day}</div>`);
  }
  panel.innerHTML = `
    <div class="cal-head">
      <div class="cal-title">${tr(MONTHS[m])} ${y}</div>
      <button class="cal-nav" data-cal="-1" aria-label="Previous month">${icon('chevronLeft', 14, 2)}</button>
      <button class="cal-nav" data-cal="1" aria-label="Next month">${icon('chevronRight', 14, 2)}</button>
    </div>
    <div class="cal-week">${WEEKDAYS.map((d) => `<span>${tr(d)}</span>`).join('')}</div>
    <div class="cal-days">${cells.join('')}</div>
    <div class="notif-head"><span>Notifications</span><button class="notif-clear" data-clear-notifs>Clear</button></div>
    <div class="notif-list" id="notifList"></div>`;
  renderNotifications();
}

function closePanels() {
  $('#quickPanel')?.classList.remove('open');
  $('#calendarPanel')?.classList.remove('open');
}
function openPanel(which) {
  const q = $('#quickPanel');
  const c = $('#calendarPanel');
  if (which === 'quick') {
    const open = q.classList.contains('open');
    closePanels();
    if (!open) {
      syncQuick();
      q.classList.add('open');
    }
  } else {
    const open = c.classList.contains('open');
    closePanels();

  }
}

function wireTopbar() {
  $('#activitiesBtn').addEventListener('click', () => {
    if (state.view !== 'desktop') return;
    if (state.overview) closeOverview();
    else openOverview();
  });
  $('#quickBtn').addEventListener('click', () => {

function wireGlobal() {
  document.addEventListener('pointerdown', (e) => {
    if (e.target.closest('#quickPanel,#calendarPanel,#quickBtn,#clockBtn,#ctxMenu,#appCtx,#appModal')) return;
    closePanels();
    closeCtx();
    closeAppCtx();
  }, true);

  document.addEventListener('contextmenu', (e) => {
    if (state.view !== 'desktop') return;
    if (e.target.closest('.window,#topbar,#dock,#overview,#quickPanel,#calendarPanel,.desk-icon,#ctxMenu,#appCtx,#appModal')) return;
    e.preventDefault();
    openCtx(e.clientX, e.clientY);
  });

  $('#desktop').addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    if (e.target.closest('.window,.desk-icon,#topbar,#dock,#overview,.panel,#ctxMenu,#appCtx')) return;
    clearDeskSelection();
  });

  document.addEventListener('keydown', (e) => {
    if (state.view !== 'desktop') return;
    if (e.key === 'Escape') {
      if (closeModal()) return;
      closeAppCtx();
      closeCtx();
      closePanels();
      if (state.overview) closeOverview();
      return;
    }
    if (e.key === 'Meta' && !e.repeat) {
      e.preventDefault();
      if (state.overview) closeOverview();
      else openOverview();
      return;
    }
    if (e.ctrlKey && e.altKey && !e.shiftKey && (e.key === 't' || e.key === 'T')) {
      e.preventDefault();
      openApp('terminal');
      return;
    }
    if (e.ctrlKey && e.altKey && !e.shiftKey && (e.key === 'l' || e.key === 'L')) {
      e.preventDefault();
      lockScreen();
    }
  });

  window.addEventListener('blur', () => {
    closeCtx();
    closeAppCtx();
    closeModal();
  });
}

/* ============================================================
   Files
   ============================================================ */
function fileNodeAt(path) {
  let node = HOME;
  for (let i = 1; i < path.length; i++) {
    if (!node.children) return null;
    const last = i === path.length - 1;
    node = node.children.find((c) => c.name === path[i] && (last || c.type === 'dir'));
    if (!node) return null;
  }
  return node;
}
function fileVisual(item) {
  if (item.type === 'dir') return { glyph: 'folder', a: '#66b1ff', b: '#2d6ccb' };
  const ext = (item.name.split('.').pop() || '').toLowerCase();
  if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) return { glyph: 'image', a: '#5fd6a0', b: '#138a62' };
  if (['mp3', 'wav', 'flac', 'm3u'].includes(ext)) return { glyph: 'music', a: '#f78fb3', b: '#b02a68' };
  if (ext === 'deb') return { glyph: 'package', a: '#ffb35c', b: '#cc6f0e' };
  if (['md'].includes(ext)) return { glyph: 'editor', a: '#c084fc', b: '#7c3aed' };
  if (['sh', 'py', 'js', 'json'].includes(ext)) return { glyph: 'code', a: '#4fd1c5', b: '#147d78' };
  return { glyph: 'file', a: '#9db1cc', b: '#5c6f8c' };
}
function openFileNode(item) {
  if (!item) return;
  const ext = (item.name.split('.').pop() || '').toLowerCase();
  if (typeof item.content === 'string') {
    openInEditor(item);
  } else if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) {
    notify('Preview not included', `The image viewer is not part of this demo, but ${item.name} is a lovely file.`, 'files');
  } else if (ext === 'deb') {
    notify('Package installation disabled', 'Nova OS is a browser demo — no real system packages are installed.', 'files');
  } else if (['mp3', 'wav', 'flac'].includes(ext)) {
    notify('No audio hardware', 'This demo does not include audio playback or sound files.', 'files');
  } else {
    notify('Can’t open this file', `${item.name} has no text preview in the demo.`, 'files');
  }
}

function mountFiles(body, win, opts = {}) {
  const state = {
    path: ['Home'],
    history: [['Home']],
    hIndex: 0,
    query: '',
    trash: !!opts.view && opts.view === 'trash'
  };

  body.innerHTML = `
    <div class="files-app">
      <aside class="files-side">
        <div class="side-head">Places</div>
        <button class="side-item" data-place="Home">${icon('home', 15)}<span>Home</span></button>
        <button class="side-item" data-place="Documents">${icon('file', 15)}<span>Documents</span></button>
        <button class="side-item" data-place="Downloads">${icon('download', 15)}<span>Downloads</span></button>
        <button class="side-item" data-place="Pictures">${icon('image', 15)}<span>Pictures</span></button>
        <button class="side-item" data-place="Music">${icon('music', 15)}<span>Music</span></button>
        <button class="side-item" data-place="Videos">${icon('monitor', 15)}<span>Videos</span></button>
        <button class="side-item trash" data-place="Trash">${icon('trash', 15)}<span>Trash</span></button>
        <div class="side-storage">Nova Disk · 38.2 GB free<div class="storage-bar"><span></span></div></div>
      </aside>
      <div class="files-main">
        <div class="files-toolbar">
          <button class="nav-btn" data-nav="back" aria-label="Back" disabled>${icon('chevronLeft', 15, 2)}</button>
          <button class="nav-btn" data-nav="forward" aria-label="Forward" disabled>${icon('chevronRight', 15, 2)}</button>
          <div class="crumbs" id="fileCrumbs"></div>
          <label class="files-search">${icon('search', 13)}<input type="text" placeholder="Search" aria-label="Search files" spellcheck="false"></label>
        </div>
        <div class="files-grid" id="fileGrid"></div>
        <div class="files-status"><span id="fileCount">0 items</span><span>Free space: 38.2 GB of 64 GB</span></div>
      </div>
    </div>`;

  const grid = $('#fileGrid', body);
  const crumbs = $('#fileCrumbs', body);
  const backBtn = $('[data-nav="back"]', body);
  const fwdBtn = $('[data-nav="forward"]', body);
  const search = $('.files-search input', body);
  const count = $('#fileCount', body);

  function currentItems() {
    if (state.trash) return [];
    const dir = fileNodeAt(state.path);
    let items = dir && dir.children ? dir.children.slice() : [];
    items.sort((a, b) => {
      if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
      return a.name.localeCompare(b.name);
    });
    if (state.query) items = items.filter((i) => i.name.toLowerCase().includes(state.query));
    return items;
  }

  function go(path, push = true) {
    if (push) {
      const last = state.history[state.hIndex];
      if (JSON.stringify(last) !== JSON.stringify(path)) {
        state.history = state.history.slice(0, state.hIndex + 1);
        state.history.push(path);
        state.hIndex = state.history.length - 1;
      }
    }
    state.path = path.slice();
    state.trash = false;
    state.query = '';
    search.value = '';
    render();
  }

  function renderCrumbs() {
    if (state.trash) {
      crumbs.innerHTML = `<span class="crumb" style="background:var(--input);color:var(--text)">Trash</span>`;
      return;
    }
    crumbs.innerHTML = state.path.map((name, i) => {
      const sep = i > 0 ? `<span class="crumb-sep">/</span>` : '';
      return `${sep}<button class="crumb" data-crumb="${i}">${esc(name)}</button>`;
    }).join('');
  }

  function renderGrid() {
    const items = currentItems();
    if (state.trash) {
      grid.innerHTML = `<div class="files-empty">${icon('trash', 38)}<b>Trash is empty</b><span>Deleted files will show up here.</span></div>`;
      count.textContent = '0 items';
      return;
    }
    if (!items.length) {
      grid.innerHTML = `<div class="files-empty">${icon(state.query ? 'search' : 'folder', 38)}<b>${state.query ? 'No results' : 'This folder is empty'}</b><span>${state.query ? `Nothing matches “${esc(state.query)}”` : 'Drag some dreams in here.'}</span></div>`;
      count.textContent = state.query ? `No results for “${state.query}”` : '0 items';
      return;
    }
    grid.innerHTML = items.map((item) => {
      const v = fileVisual(item);
      const meta = item.type === 'dir' ? `${item.children ? item.children.length : 0} items` : (item.size || '');
      return `<div class="file-item" data-name="${esc(item.name)}" data-type="${item.type}" title="${esc(item.name)}" style="--fa:${v.a};--fb:${v.b}">
        <div class="f-ic">${icon(v.glyph, 22)}</div>
        <div class="f-name">${esc(item.name)}</div>
        <div class="f-meta">${esc(meta)}</div>
      </div>`;
    }).join('');
    const shown = state.query ? ` (${items.length} shown)` : '';
    count.textContent = `${items.length} item${items.length === 1 ? '' : 's'}${shown}`;
  }

  function render() {
    renderCrumbs();
    renderGrid();
    backBtn.disabled = state.trash ? state.hIndex <= 0 : state.hIndex <= 0;
    fwdBtn.disabled = state.trash || state.hIndex >= state.history.length - 1;
    $$('.side-item', body).forEach((el) => {
      const place = el.dataset.place;
      const active = state.trash ? place === 'Trash' : (state.path.length === 1 ? place === 'Home' : state.path[1] === place);
      el.classList.toggle('active', active && !(place === 'Trash' && !state.trash));
    });
  }

  /* ---------- move files and folders with the mouse ---------- */
  let fileDrag = null;
  let suppressClick = false;

  function childNamed(dir, name) {
    return dir && dir.children ? dir.children.find((c) => c.name === name) : null;
  }
  function dirContains(parent, target) {
    if (parent === target) return true;
    if (parent.type !== 'dir' || !parent.children) return false;
    return parent.children.some((c) => c.type === 'dir' && dirContains(c, target));
  }
  function canDropInto(dest, drag) {
    return !!dest && dest.type === 'dir' && dest !== drag.sourceDir &&
      !(drag.item.type === 'dir' && dirContains(drag.item, dest));
  }
  function uniqueName(dir, name) {
    const dot = name.lastIndexOf('.');
    const base = dot > 0 ? name.slice(0, dot) : name;
    const ext = dot > 0 ? name.slice(dot) : '';
    let n = 2;
    let candidate = `${base} (${n})${ext}`;
    while ((dir.children || []).some((c) => c.name === candidate)) {
      n++;
      candidate = `${base} (${n})${ext}`;
    }
    return candidate;
  }

  function dropTargetAt(x, y) {
    const drag = fileDrag;
    if (!drag || !drag.item || !drag.started) return null;
    const el = document.elementFromPoint(x, y);
    if (!el) return null;

    const placeEl = el.closest('.side-item[data-place]');
    if (placeEl) {
      const place = placeEl.dataset.place;
      if (place === 'Trash') return null;
      const path = place === 'Home' ? ['Home'] : ['Home', place];
      const dir = fileNodeAt(path);
      return canDropInto(dir, drag) ? { el: placeEl, dir, label: place } : null;
    }

    const crumbEl = el.closest('[data-crumb]');
    if (crumbEl) {
      const path = state.path.slice(0, Number(crumbEl.dataset.crumb) + 1);
      const dir = fileNodeAt(path);
      return canDropInto(dir, drag) ? { el: crumbEl, dir, label: path[path.length - 1] } : null;
    }

    const itemEl = el.closest('.file-item');
    if (itemEl) {
      const dir = childNamed(drag.sourceDir, itemEl.dataset.name);
      return canDropInto(dir, drag) ? { el: itemEl, dir, label: dir.name } : null;
    }
    return null;
  }

  function markDropTarget(next) {
    const drag = fileDrag;
    if (!drag) return;
    const prev = drag.target;
    if (prev && (!next || prev.el !== next.el)) prev.el.classList.remove('file-drop-target');
    if (next) next.el.classList.add('file-drop-target');
    drag.target = next;
  }

  function beginFileDrag(drag, e) {
    drag.started = true;
    const v = fileVisual(drag.item);
    const ghost = document.createElement('div');
    ghost.className = 'file-ghost';
    ghost.style.setProperty('--fa', v.a);
    ghost.style.setProperty('--fb', v.b);
    ghost.innerHTML = `<div class="f-ic">${icon(v.glyph, 22)}</div><div class="f-name">${esc(drag.item.name)}</div>`;
    ghost.style.transform = `translate3d(${e.clientX + 12}px,${e.clientY + 10}px,0)`;
    document.body.appendChild(ghost);
    drag.ghost = ghost;
    drag.itemEl.classList.add('file-drag-source');
    document.body.classList.add('file-drag-active');
  }

  function finishFileDrag(commit) {
    const drag = fileDrag;
    if (!drag) return;
    if (drag.ghost) drag.ghost.remove();
    drag.itemEl.classList.remove('file-drag-source');
    if (drag.target) drag.target.el.classList.remove('file-drop-target');
    document.body.classList.remove('file-drag-active');
    fileDrag = null;

    if (drag.started && commit && drag.target) {
      const { dir: destDir, label } = drag.target;
      const sourceDir = drag.sourceDir;
      const item = drag.item;
      const oldName = item.name;
      const index = sourceDir.children.indexOf(item);
      if (index >= 0) {
        sourceDir.children.splice(index, 1);
        const finalName = childNamed(destDir, oldName) ? uniqueName(destDir, oldName) : oldName;
        item.name = finalName;
        destDir.children.push(item);
        render();
        const note = finalName !== oldName ? ` as “${finalName}”` : '';
        notify(item.type === 'dir' ? 'Folder moved' : 'File moved', `${oldName} moved to ${label}${note}`, 'files', {
          action: {
            label: 'Undo',
            onClick: () => {
              const at = destDir.children.indexOf(item);
              if (at >= 0) destDir.children.splice(at, 1);
              item.name = oldName;
              sourceDir.children.splice(clamp(index, 0, sourceDir.children.length), 0, item);
              render();
            }
          }
        });
      }
    }

    if (drag.started) {
      suppressClick = true;
      setTimeout(() => { suppressClick = false; }, 80);
    }
  }

  function onFilePointerMove(e) {
    const drag = fileDrag;
    if (!drag || e.pointerId !== drag.pointerId) return;
    if (!drag.started) {
      if (Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < 6) return;
      beginFileDrag(drag, e);
    }
    e.preventDefault();
    if (!drag.ghost) return;
    drag.ghost.style.transform = `translate3d(${e.clientX + 12}px,${e.clientY + 10}px,0)`;

    const r = grid.getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX <= r.right) {
      if (e.clientY > r.bottom - 30 && e.clientY < r.bottom + 28) grid.scrollTop += 18;
      else if (e.clientY < r.top + 30 && e.clientY > r.top - 28) grid.scrollTop -= 18;
    }
    markDropTarget(dropTargetAt(e.clientX, e.clientY));
  }

  function onFilePointerUp(e) {
    const drag = fileDrag;
    if (!drag || e.pointerId !== drag.pointerId) return;
    finishFileDrag(true);
  }

  grid.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || e.pointerType === 'touch' || state.trash) return;
    const itemEl = e.target.closest('.file-item');
    if (!itemEl) return;
    const sourceDir = fileNodeAt(state.path);
    const item = childNamed(sourceDir, itemEl.dataset.name);
    if (!item) return;
    fileDrag = {
      pointerId: e.pointerId, startX: e.clientX, startY: e.clientY,
      itemEl, item, sourceDir, started: false, ghost: null, target: null
    };
    $$('.file-item.selected', body).forEach((n) => n.classList.remove('selected'));
    itemEl.classList.add('selected');
  });

  window.addEventListener('pointermove', onFilePointerMove);
  window.addEventListener('pointerup', onFilePointerUp);
  window.addEventListener('pointercancel', onFilePointerUp);

  body.addEventListener('click', (e) => {
    if (suppressClick) { suppressClick = false; return; }
    const place = e.target.closest('[data-place]');
    if (place) {
      if (place.dataset.place === 'Trash') {
        state.trash = true;
        state.query = '';
        search.value = '';
        render();
      } else {
        go(place.dataset.place === 'Home' ? ['Home'] : ['Home', place.dataset.place], true);
      }
      return;
    }
    const nav = e.target.closest('[data-nav]');
    if (nav) {
      if (nav.dataset.nav === 'back') {
        if (state.trash) {
          state.trash = false;
          render();
          return;
        }
        if (state.hIndex > 0) {
          state.hIndex--;
          state.path = state.history[state.hIndex].slice();
          state.query = '';
          search.value = '';
          render();
        }
      } else if (!state.trash && state.hIndex < state.history.length - 1) {
        state.hIndex++;
        state.path = state.history[state.hIndex].slice();
        state.query = '';
        search.value = '';
        render();
      }
      return;
    }
    const crumb = e.target.closest('[data-crumb]');
    if (crumb) {
      go(state.path.slice(0, Number(crumb.dataset.crumb) + 1), true);
      return;
    }
    const itemEl = e.target.closest('.file-item');
    if (itemEl) {
      $$('.file-item.selected', body).forEach((n) => n.classList.remove('selected'));
      itemEl.classList.add('selected');
    }
  });

  body.addEventListener('dblclick', (e) => {
    const itemEl = e.target.closest('.file-item');
    if (!itemEl || state.trash) return;
    const dir = fileNodeAt(state.path);
    const item = dir && dir.children ? dir.children.find((c) => c.name === itemEl.dataset.name) : null;
    if (!item) return;
    if (item.type === 'dir') go([...state.path, item.name], true);
    else openFileNode(item);
  });

  search.addEventListener('input', () => {
    state.query = search.value.trim().toLowerCase();
    renderGrid();
  });

  render();

  return function cleanupFiles() {
    if (fileDrag) {
      if (fileDrag.ghost) fileDrag.ghost.remove();
      if (fileDrag.itemEl) fileDrag.itemEl.classList.remove('file-drag-source');
      if (fileDrag.target) fileDrag.target.el.classList.remove('file-drop-target');
      document.body.classList.remove('file-drag-active');
      fileDrag = null;
    }
    suppressClick = false;
    window.removeEventListener('pointermove', onFilePointerMove);
    window.removeEventListener('pointerup', onFilePointerUp);
    window.removeEventListener('pointercancel', onFilePointerUp);
  };
}

function mountTerminal(body, win) {
  let cwd = ['Home'];
  const history = [];
  let hPos = 0;

  body.innerHTML = `
    <div class="term">
      <div class="term-scroll">
        <div class="term-lines"></div>
        <div class="term-input-line">
          <span class="term-prompt"></span>
          <input class="term-input" type="text" spellcheck="false" autocomplete="off" aria-label="Terminal input">
        </div>
      </div>
      <div class="term-hint">Try <kbd>help</kbd> · <kbd>neofetch</kbd> · <kbd>ls</kbd> · <kbd>theme light</kbd></div>
    </div>`;

  const scroll = $('.term-scroll', body);
  const out = $('.term-lines', body);
  const input = $('.term-input', body);
  const promptEl = $('.term-prompt', body);

  const pathLabel = () => (cwd.length === 1 ? '~' : `~/${cwd.slice(1).join('/')}`);
  const updatePrompt = () => {
    promptEl.innerHTML = `<span class="green">demo@nova</span>:<span class="cyan">${esc(pathLabel())}</span>$`;
  };
  const scrollDown = () => { scroll.scrollTop = scroll.scrollHeight; };
  function print(html, cls = '') {
    const line = document.createElement('div');
    line.className = `term-line${cls ? ' ' + cls : ''}`;
    line.innerHTML = html;
    out.appendChild(line);
    scrollDown();
    return line;
  }
  function safeText(s) { return esc(s).replace(/\n/g, '<br>'); }

  function resolvePath(arg) {
    if (!arg || arg === '~' || arg === '.' || arg === '/home/demo' || arg === '/home/demo/') return ['Home'];
    if (arg === '..') return cwd.length > 1 ? cwd.slice(0, -1) : ['Home'];
    if (arg === '/') return null;
    let rest;
    if (arg.startsWith('~/')) rest = arg.slice(2);
    else if (arg.startsWith('/home/demo/')) rest = arg.slice(11);
    else if (arg.startsWith('/')) return null;
    else rest = arg;
    const parts = rest.split('/').filter(Boolean);
    const result = cwd.slice();
    for (let i = 0; i < parts.length; i++) {
      const part = parts[i];
      if (part === '.') continue;
      if (part === '..') { if (result.length > 1) result.pop(); continue; }
      const node = fileNodeAt(result);
      const last = i === parts.length - 1;
      if (!node || !node.children || !node.children.some((c) => c.name === part && (last || c.type === 'dir'))) return null;
      result.push(part);
    }
    return result;
  }
  function getNode(arg) {
    const path = resolvePath(arg);
    if (!path) return null;
    return fileNodeAt(path);
  }
  function getCwdNode() { return fileNodeAt(cwd); }
  function absPath() { return `/home/demo${cwd.length > 1 ? '/' + cwd.slice(1).join('/') : ''}`; }

  function banner() {
    print(`<span class="violet">Nova OS 24.10</span> <span class="white">(Nebula)</span> — GNU/Linux demo`);
    print(`<span class="dim">Type “help” to see the available commands.</span>`);
    print('');
  }

  function cmdLs(args) {
    const targetArg = args.find((a) => !a.startsWith('-'));
    const node = targetArg ? getNode(targetArg) : getCwdNode();
    if (!node) { print(`<span class="red">ls: cannot access '${esc(targetArg)}': No such file or directory</span>`); return; }
    if (node.type !== 'dir' || !node.children) { print(esc(targetArg || node.name)); return; }
    if (!node.children.length) return;
    const items = node.children.slice().sort((a, b) => a.name.localeCompare(b.name));
    print(items.map((c) => c.type === 'dir' ? `<span class="cyan">${esc(c.name)}/</span>` : esc(c.name)).join('   '));
  }
  function cmdCd(args) {
    const arg = args[0];
    if (!arg) { cwd = ['Home']; return; }
    const path = resolvePath(arg);
    const node = path ? fileNodeAt(path) : null;
    if (!node || node.type !== 'dir') { print(`<span class="red">cd: ${esc(arg)}: No such directory</span>`); return; }
    cwd = path;
  }
  function cmdCat(args) {
    if (!args[0]) { print(`<span class="red">cat: missing file operand</span>`); return; }
    const node = getNode(args[0]);
    if (!node || node.type !== 'file') { print(`<span class="red">cat: ${esc(args[0])}: No such file</span>`); return; }
    if (typeof node.content !== 'string') { print(`<span class="red">cat: ${esc(args[0])}: binary file</span>`); return; }
    print(safeText(node.content));

  function cmdNeofetch() {

      '       ✦✦✦✦✦',
      '        ✦✦✦',

    ].join('\n');
    print(`<span class="violet">${art}</span>`);

    const info = [
      `<span class="green">demo@nova</span>`,

    ].join('\n');

  }
  function cmdHelp() {
    print(`<span class="white">Available commands</span>`);
    print(`  <span class="cyan">help</span>             this help text`);
    print(`  <span class="cyan">neofetch</span>         system information with a little art`);
    print(`  <span class="cyan">ls</span> [path]        list directory contents`);
    print(`  <span class="cyan">cd</span> [path]        change directory (try “cd Documents”)`);
    print(`  <span class="cyan">pwd</span>              print the working directory`);
    print(`  <span class="cyan">cat</span> &lt;file&gt;       print a text file`);
    print(`  <span class="cyan">open</span> &lt;app&gt;       launch files, terminal, editor, calculator, monitor, settings`);
    print(`  <span class="cyan">theme</span> dark|light  change the desktop theme`);
    print(`  <span class="cyan">wallpaper</span> &lt;name&gt;  aurora, sage or ember`);
    print(`  <span class="cyan">calc</span> &lt;expr&gt;      evaluate a small expression`);
    print(`  <span class="cyan">history</span>          show command history`);
    print(`  <span class="cyan">cowsay</span> &lt;text&gt;    important cow-related output`);
    print(`  <span class="cyan">clear</span>            clear the screen`);
    print(`  <span class="cyan">exit</span>             close the terminal`);
  }
  function cmdOpen(args) {
    const raw = args.join(' ').toLowerCase();
    const map = {
      files: 'files', file: 'files', terminal: 'terminal', term: 'terminal',
      editor: 'editor', text: 'editor', calculator: 'calculator', calc: 'calculator',
      monitor: 'monitor', system: 'monitor', settings: 'settings', welcome: 'welcome'
    };
    const id = map[raw];
    if (!id) { print(`<span class="red">open: unknown application “${esc(raw)}”</span>`); return; }
    if (id === 'terminal') { print(`<span class="dim">Terminal is already running.</span>`); return; }
    openApp(id);
    print(`<span class="dim">Launching ${APPS[id].name}…</span>`);
  }
  function cmdCowsay(text) {
    if (!text) { print(`<span class="red">cowsay: what should the cow say?</span>`); return; }
    const line = '-'.repeat(text.length + 2);
    print(` ${line}\n&lt; ${esc(text)} &gt;\n ${line}\n        \\   ^__^\n         \\  (oo)\\_______\n            (__)\\       )\\/\\\n                ||----w |\n                ||     ||`);
  }

  function run(raw) {
    print(`<span class="green">demo@nova</span>:<span class="cyan">${esc(pathLabel())}</span>$ ${esc(raw)}`);
    if (raw) { history.push(raw); hPos = history.length; }
    const parts = raw.split(/\s+/).filter(Boolean);
    const cmd = (parts[0] || '').toLowerCase();
    const args = parts.slice(1);
    switch (cmd) {
      case '': break;
      case 'help': cmdHelp(); break;
      case 'neofetch': cmdNeofetch(); break;
      case 'ls': cmdLs(args); break;
      case 'cd': cmdCd(args); break;
      case 'pwd': print(absPath()); break;
      case 'cat': cmdCat(args); break;
      case 'echo': print(esc(args.join(' '))); break;
      case 'whoami': print('demo'); break;
      case 'hostname': print('nova'); break;
      case 'date': print(new Date().toString()); break;
      case 'uname':
        print(args.includes('-a') ? 'Linux nova 6.11.0-nova #1 SMP PREEMPT_DYNAMIC Nova 24.10 x86_64 GNU/Linux' : 'Linux');
        break;
      case 'clear': out.innerHTML = ''; break;
      case 'history':
        history.forEach((h, i) => print(`  ${String(i + 1).padStart(2)}  ${esc(h)}`));
        break;
      case 'open': cmdOpen(args); break;
      case 'theme': {
        const val = (args[0] || '').toLowerCase();
        if (val === 'dark' || val === 'light') {
          S.theme = val; persist(); applySettings();
          print(`<span class="dim">Theme set to ${val}.</span>`);
        } else print(`<span class="red">theme: use “theme dark” or “theme light”</span>`);
        break;
      }
      case 'wallpaper': {
        const val = (args[0] || '').toLowerCase();
        if (WALLS.includes(val)) {
          S.wallpaper = val; persist(); applySettings();
          print(`<span class="dim">Wallpaper set to ${val}.</span>`);
        } else print(`<span class="red">wallpaper: choose aurora, sage or ember</span>`);
        break;
      }
      case 'calc': {
        const expr = args.join(' ');
        if (!expr) { print(`<span class="red">calc: give me something to calculate</span>`); break; }
        const result = evaluateMath(expr);
        if (result === null) print(`<span class="red">calc: invalid expression</span>`);
        else print(`<span class="white">${esc(result)}</span>`);
        break;
      }
      case 'cowsay': cmdCowsay(args.join(' ')); break;
      case 'sudo': print(`<span class="red">demo is not in the sudoers file. This incident has been reported.</span>`); break;
      case 'exit': print(`<span class="dim">logout</span>`); setTimeout(() => closeWin(win), 300); break;
      default: print(`<span class="red">bash: ${esc(parts[0])}: command not found</span>`);
    }
    print('');
    updatePrompt();
    scrollDown();
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const value = input.value;
      input.value = '';
      run(value.trim());
      e.preventDefault();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (!history.length) return;
      hPos = Math.max(0, hPos - 1);
      input.value = history[hPos] || '';
      setTimeout(() => input.setSelectionRange(input.value.length, input.value.length), 0);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      hPos = Math.min(history.length, hPos + 1);
      input.value = history[hPos] || '';
    } else if (e.ctrlKey && (e.key === 'l' || e.key === 'L')) {
      e.preventDefault();
      out.innerHTML = '';
    }
  });

  body.addEventListener('click', () => {
    const sel = window.getSelection();
    if (!sel || !sel.toString()) input.focus();
  });

  banner();
  updatePrompt();
  setTimeout(() => { try { input.focus(); } catch (e) { /* ignore */ } }, 180);
}

  }

    node = file;
    nameEl.textContent = file.name;
    area.value = file.content || '';

    setWinTitle(win, file.name);
    updateMeta();
    area.scrollTop = 0;
    area.setSelectionRange(0, 0);
    setTimeout(() => { try { area.focus(); } catch (e) { /* ignore */ } }, 60);

    area.setSelectionRange(0, 0);

    setWinTitle(win, 'Text Editor');
    setStatus(true);
  }
  updateMeta();
  setTimeout(() => { try { area.focus(); } catch (e) { /* ignore */ } }, 160);

  area.addEventListener('input', () => {
    dirty = true;
    setStatus(false);
    updateMeta();
  });
  area.addEventListener('keyup', updateMeta);
  area.addEventListener('click', updateMeta);
  area.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      save();
    }
  });
  saveBtn.addEventListener('click', save);
}

/* ============================================================
   Calculator
   ============================================================ */
function evaluateMath(expr) {
  let s = String(expr)
    .replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-')
    .replace(/,/g, '.').replace(/\s+/g, '');
  if (!s || !/^[0-9+\-*/().%]+$/.test(s)) return null;
  s = s.replace(/%/g, '/100');
  if (s.length > 80) return null;
  try {
    const val = Function(`"use strict"; return (${s});`)();
    if (typeof val !== 'number' || !Number.isFinite(val)) return null;
    return String(Number(val.toPrecision(12)));
  } catch (e) {
    return null;
  }
}

function mountCalculator(body, win) {
  let expr = '';
  let result = '0';
  let justEvaluated = false;

  body.innerHTML = `
    <div class="calc">
      <div class="calc-display"><div class="calc-expr"></div><div class="calc-result">0</div></div>
      <div class="calc-grid">
        <button class="calc-key fn" data-val="AC">AC</button>
        <button class="calc-key fn" data-val="±">±</button>
        <button class="calc-key fn" data-val="back">⌫</button>
        <button class="calc-key op" data-val="÷">÷</button>
        <button class="calc-key" data-val="7">7</button>
        <button class="calc-key" data-val="8">8</button>
        <button class="calc-key" data-val="9">9</button>
        <button class="calc-key op" data-val="×">×</button>
        <button class="calc-key" data-val="4">4</button>
        <button class="calc-key" data-val="5">5</button>
        <button class="calc-key" data-val="6">6</button>
        <button class="calc-key op" data-val="−">−</button>
        <button class="calc-key" data-val="1">1</button>
        <button class="calc-key" data-val="2">2</button>
        <button class="calc-key" data-val="3">3</button>
        <button class="calc-key op" data-val="+">+</button>
        <button class="calc-key zero" data-val="0">0</button>
        <button class="calc-key" data-val=".">.</button>
        <button class="calc-key eq" data-val="=">=</button>
      </div>
    </div>`;

  const exprEl = $('.calc-expr', body);
  const resultEl = $('.calc-result', body);

  function update(previewText) {
    exprEl.textContent = previewText !== undefined ? previewText : (expr || ' ');
    resultEl.textContent = result;
  }
  function refresh() {
    if (justEvaluated) {
      update(`${expr} =`);
      return;
    }
    if (!expr) {
      result = '0';
      update(' ');
      return;
    }
    result = expr;
    const preview = evaluateMath(expr);
    update(preview !== null && /[+\-×÷]/.test(expr) ? `= ${preview}` : ' ');
  }
  function append(value) {
    const last = expr.slice(-1);
    const ops = ['+', '−', '×', '÷'];
    if (justEvaluated) {
      if (/[0-9.]/.test(value)) expr = '';
      expr = expr || result;
      justEvaluated = false;
    }
    if (ops.includes(value)) {
      if (!expr) expr = '0';
      else if (ops.includes(expr.slice(-1))) expr = expr.slice(0, -1);
      expr += value;
    } else if (value === '.') {
      const chunk = expr.split(/[+\-×÷]/).pop();
      if (chunk.includes('.')) return;
      expr += chunk === '' ? '0.' : '.';
    } else {
      expr += value;
    }
    result = expr;
    const preview = evaluateMath(expr);
    update(preview !== null && /[+\-×÷]/.test(expr) ? `= ${preview}` : ' ');
  }
  function equals() {
    if (!expr || justEvaluated) return;
    const value = evaluateMath(expr);
    if (value === null) {
      resultEl.textContent = 'Error';
      exprEl.textContent = expr;
      return;
    }
    const equation = expr;
    expr = value;
    result = value;
    justEvaluated = true;
    update(`${equation} =`);
  }
  function press(val) {
    if (val === 'AC') {
      expr = '';
      result = '0';
      justEvaluated = false;
      update(' ');
    } else if (val === 'back') {
      if (justEvaluated) {
        expr = '';
        result = '0';
        justEvaluated = false;
        update(' ');
      } else {
        expr = expr.slice(0, -1);
        refresh();
      }
    } else if (val === '±') {
      if (justEvaluated) {
        expr = expr.startsWith('-') ? expr.slice(1) : `-${expr}`;
        result = expr;
        update('');
      } else if (expr) {
        expr = expr.startsWith('-') ? expr.slice(1) : `-${expr}`;
        refresh();
      }
    } else if (val === '=') {
      equals();
    } else if (/^[0-9]$/.test(val)) {
      if (expr === '0' && !justEvaluated) expr = '';
      append(val);
    } else {
      append(val);
    }
  }

  body.querySelector('.calc-grid').addEventListener('click', (e) => {
    const key = e.target.closest('.calc-key');
    if (key) press(key.dataset.val);
  });

  const keyHandler = (e) => {
    if (state.focused !== win.id) return;
    if (document.querySelector('#appModal.open')) return;
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (/^[0-9]$/.test(k)) { press(k); e.preventDefault(); }
    else if (k === '.' || k === ',') { press('.'); e.preventDefault(); }
    else if (k === '+') { press('+'); e.preventDefault(); }
    else if (k === '-') { press('−'); e.preventDefault(); }
    else if (k === '*') { press('×'); e.preventDefault(); }
    else if (k === '/') { press('÷'); e.preventDefault(); }
    else if (k === 'Enter' || k === '=') { press('='); e.preventDefault(); }
    else if (k === 'Backspace') { press('back'); e.preventDefault(); }
    else if (k === 'Escape' || k === 'Delete') { press('AC'); e.preventDefault(); }
  };
  document.addEventListener('keydown', keyHandler);

  refresh();
  return () => document.removeEventListener('keydown', keyHandler);
}

/* ============================================================
   System Monitor
   ============================================================ */
function mountMonitor(body, win) {
  const POINTS = 64;
  let cpu = 24 + Math.random() * 14;
  let mem = 44 + Math.random() * 10;
  let net = 1 + Math.random() * 3;
  const cpuHist = Array.from({ length: POINTS }, () => 18 + Math.random() * 25);
  const memHist = Array.from({ length: POINTS }, () => 42 + Math.random() * 10);
  const procs = [
    { name: 'gnome-shell', cpu: 6.2, mem: 412 },
    { name: 'firefox', cpu: 12.8, mem: 1240 },
    { name: 'code', cpu: 4.1, mem: 866 },
    { name: 'nova-term', cpu: 0.4, mem: 74 },
    { name: 'systemd', cpu: 0.1, mem: 32 }
  ];

  body.innerHTML = `
    <div class="mon">
      <div class="mon-cards">
        <div class="mon-card cpu">
          <div class="lbl">Processor</div>
          <div class="val" id="monCpu">24%</div>
          <div class="sub">8 vCPU · Nova Core i7</div>
          <div class="bar"><span id="monCpuBar" style="width:24%"></span></div>
        </div>
        <div class="mon-card mem">
          <div class="lbl">Memory</div>
          <div class="val" id="monMem">48%</div>
          <div class="sub" id="monMemSub">7.6 GiB of 16 GiB</div>
          <div class="bar"><span id="monMemBar" style="width:48%"></span></div>
        </div>
        <div class="mon-card net">
          <div class="lbl">Network</div>
          <div class="val" id="monNet">2.4 MB/s</div>
          <div class="sub">Wi-Fi · Nova-5G</div>
          <div class="bar"><span id="monNetBar" style="width:30%;background:#e5a54b"></span></div>
        </div>
      </div>
      <div class="mon-chart">
        <div class="mon-chart-head">Resource usage
          <div class="mon-legend"><span><i style="background:var(--accent)"></i>CPU</span><span><i style="background:#20b2a6"></i>Memory</span></div>
        </div>
        <div class="mon-canvas-wrap"><canvas></canvas></div>
      </div>
      <div class="mon-proc">
        <div class="mon-proc-head"><span>Process</span><span>CPU</span><span>Memory</span></div>
        ${procs.map((p, i) => `<div class="proc-row"><div class="pname"><span class="pdot" style="background:${['var(--accent)', '#20b2a6', '#e5a54b', '#c084fc', '#7d8798'][i]}"></span><span>${p.name}</span></div><div class="pnum" data-pcpu="${i}">${p.cpu.toFixed(1)}%</div><div class="pnum" data-pmem="${i}">${p.mem} MB</div></div>`).join('')}
      </div>
    </div>`;

  const canvas = $('.mon-canvas-wrap canvas', body);
  const ctx = canvas.getContext('2d');
  let W = 0;
  let H = 0;

  function accentRgba(alpha) {
    const hex = getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#3584e4';
    const m = /^#?([a-f0-9]{2})([a-f0-9]{2})([a-f0-9]{2})$/i.exec(hex);
    if (!m) return `rgba(53,132,228,${alpha})`;
    return `rgba(${parseInt(m[1], 16)},${parseInt(m[2], 16)},${parseInt(m[3], 16)},${alpha})`;
  }
  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    W = Math.max(10, rect.width);
    H = Math.max(10, rect.height);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function series(hist, color, fill, alpha, max) {
    if (hist.length < 2) return;
    const step = W / (POINTS - 1);
    const plot = (v, i) => {
      const x = i * step;
      const y = H - (v / max) * (H - 8) - 4;
      return [x, y];
    };
    ctx.beginPath();
    hist.forEach((v, i) => {
      const [x, y] = plot(v, i);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    if (fill) {
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, accentRgba(alpha));
      grad.addColorStop(1, accentRgba(0));
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
    }
    ctx.beginPath();
    hist.forEach((v, i) => {
      const [x, y] = plot(v, i);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.8;
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
  function draw() {
    if (!W || !H) return;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(128,135,150,.16)';
    ctx.lineWidth = 1;
    for (let i = 1; i <= 3; i++) {
      const y = (H / 4) * i;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    const max = Math.max(60, Math.ceil((Math.max(...cpuHist, ...memHist) + 6) / 20) * 20);
    series(memHist, '#20b2a6', false, 0, max);
    series(cpuHist, accentRgba(1), true, 0.3, max);
  }

  const ro = new ResizeObserver(resize);
  ro.observe(canvas.parentElement);
  resize();

  function tick() {
    cpu = clamp(cpu + (Math.random() - 0.48) * 14, 4, 92);
    mem = clamp(mem + (Math.random() - 0.5) * 4, 32, 82);
    net = clamp(net + (Math.random() - 0.5) * 3, 0.2, 11);
    cpuHist.push(cpu);
    memHist.push(mem);
    if (cpuHist.length > POINTS) cpuHist.shift();
    if (memHist.length > POINTS) memHist.shift();
    $('#monCpu', body).textContent = `${Math.round(cpu)}%`;
    $('#monMem', body).textContent = `${Math.round(mem)}%`;
    $('#monNet', body).textContent = `${net.toFixed(1)} MB/s`;
    $('#monMemSub', body).textContent = `${((mem / 100) * 16).toFixed(1)} GiB of 16 GiB`;
    $('#monCpuBar', body).style.width = `${cpu}%`;
    $('#monMemBar', body).style.width = `${mem}%`;
    $('#monNetBar', body).style.width = `${clamp(net * 9, 4, 100)}%`;
    procs.forEach((p, i) => {
      p.cpu = clamp(p.cpu + (Math.random() - 0.5) * 2.6, 0, 34);
      p.mem = clamp(p.mem + (Math.random() - 0.5) * 18, 20, 1800);
      const cpuEl = $(`[data-pcpu="${i}"]`, body);
      const memEl = $(`[data-pmem="${i}"]`, body);
      if (cpuEl) cpuEl.textContent = `${p.cpu.toFixed(1)}%`;
      if (memEl) memEl.textContent = `${Math.round(p.mem)} MB`;
    });
    draw();
  }
  tick();
  const timer = setInterval(tick, 1200);
  return () => { clearInterval(timer); ro.disconnect(); };
}

          <button class="btn primary" data-act="explore">${icon('grid', 14)}Explore apps</button>
          <button class="btn" data-act="terminal">${icon('terminal', 14)}Open Terminal</button>
          <button class="btn ghost" data-act="readme">${icon('editor', 14)}Read the README</button>
        </div>
        <div class="foot">Demo build · no actual kernel was harmed</div>
      </div>`;
    if (typeof applyI18n === 'function') applyI18n(body);
  }

  function step(now) {
    if (!active) return;
    const p = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    if (fill) fill.style.strokeDashoffset = String(circumference * (1 - eased));
    if (pct) pct.textContent = `${Math.round(eased * 100)}%`;
    if (p < 1) raf = requestAnimationFrame(step);
    else finishTimer = setTimeout(showContent, reduceMotion ? 60 : 260);
  }
  raf = requestAnimationFrame(step);

  body.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    if (btn.dataset.act === 'explore') openOverview();
    else if (btn.dataset.act === 'terminal') openApp('terminal');
    else if (btn.dataset.act === 'readme') openInEditor(README_NODE);
  });

  return () => {
    active = false;
    cancelAnimationFrame(raf);
    clearTimeout(finishTimer);
  };
}

/* ============================================================

   ============================================================ */
let appMenuTarget = null;

function deskTile(item) {
  return `<span class="app-tile" style="--ta:${item.a};--tb:${item.b}">${icon(item.glyph, 22)}</span>`;
}
function targetForApp(id) {
  return {
    kind: 'app', id, appId: id, name: appName(id),
    type: 'Application', tile: appTile(id), link: `nova://app/${id}`
  };
}
function targetForDesk(index) {
  const item = DESK_ITEMS[index];
  if (!item) return null;
  return {
    kind: 'desk', index, appId: item.appId, name: deskLabel(item),
    type: item.type, tile: deskTile(item), itemName: item.name,
    link: `nova://desktop/${encodeURIComponent(item.name)}`
  };
}
function targetSubtitle(target) {
  if (!target) return '';
  if (target.kind === 'app') {
    return `Application · ${openWindows.has(target.id) ? 'Running' : 'Not running'}`;
  }
  return `${target.type} · Desktop`;
}
function targetAppId(target) {
  return target && target.appId && APPS[target.appId] ? target.appId : 'files';
}

/* ---------- context menu ---------- */
function buildAppMenu() {
  const menu = $('#appCtx');
  const modal = $('#appModal');
  if (!menu || !modal) return;

  menu.addEventListener('click', (e) => {
    const item = e.target.closest('[data-app-act]');
    if (!item || !appMenuTarget) return;
    handleAppAction(item.dataset.appAct, appMenuTarget);
  });

  modal.addEventListener('click', (e) => {
    if (e.target.closest('[data-modal-close]') || e.target.closest('.modal-scrim')) closeModal();
  });

  document.addEventListener('contextmenu', (e) => {
    if (state.view !== 'desktop') return;
    let target = null;
    const dockItem = e.target.closest('#dock .dock-item');
    const ovItem = e.target.closest('#ovApps .ov-app');
    const deskItem = e.target.closest('#desktopIcons .desk-icon');
    const winTile = e.target.closest('.window .win-title .app-tile');

    if (dockItem) target = targetForApp(dockItem.dataset.app);
    else if (ovItem) target = targetForApp(ovItem.dataset.app);
    else if (deskItem) {
      target = targetForDesk(Number(deskItem.dataset.desk));
      $$('.desk-icon.selected').forEach((n) => n.classList.remove('selected'));
      deskItem.classList.add('selected');
    } else if (winTile) {
      const winEl = winTile.closest('.window');
      const win = winEl ? winById(winEl.dataset.winId) : null;
      if (win) target = targetForApp(win.appId);
    }

    if (!target) return;
    e.preventDefault();
    openAppMenu(target, e.clientX, e.clientY);
  });
}

function openAppMenu(target, x, y) {
  const menu = $('#appCtx');
  if (!menu) return;
  appMenuTarget = target;
  closeCtx();
  closePanels();
  if ($('#appModal')?.classList.contains('open')) closeModal();

  menu.innerHTML = `
    <div class="appctx-head">${target.tile}
      <div class="appctx-meta"><b>${esc(target.name)}</b><span>${esc(targetSubtitle(target))}</span></div>
    </div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-app-act="open">${icon('arrowRight', 14)}<span>Open</span></div>
    <div class="ctx-item" data-app-act="admin">${icon('shield', 14)}<span>Open with Admin Permissions</span></div>
    <div class="ctx-item" data-app-act="share">${icon('share', 14)}<span>Share With…</span></div>
    <div class="ctx-item" data-app-act="phone">${icon('phone', 14)}<span>Open on My Phone</span></div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-app-act="rename">${icon('pencil', 14)}<span>Rename…</span></div>
    <div class="ctx-item danger" data-app-act="delete">${icon('trash', 14)}<span>Delete</span></div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-app-act="props">${icon('info', 14)}<span>Properties</span></div>`;

  menu.classList.add('open');
  menu.style.left = '0px';
  menu.style.top = '0px';
  const rect = menu.getBoundingClientRect();
  menu.style.left = `${clamp(x, 8, Math.max(8, window.innerWidth - rect.width - 8))}px`;
  menu.style.top = `${clamp(y, 8, Math.max(8, window.innerHeight - rect.height - 8))}px`;
}

function closeAppCtx() {
  $('#appCtx')?.classList.remove('open');
}

function handleAppAction(act, target) {
  if (!target) return;
  closeAppCtx();
  closePanels();
  closeOverview();
  switch (act) {
    case 'open': launchAppTarget(target); break;
    case 'admin': openAdminModal(target); break;
    case 'share': openShareModal(target); break;
    case 'phone': openPhoneModal(target); break;
    case 'rename': openRenameModal(target); break;
    case 'delete': deleteAppTarget(target); break;
    case 'props': openPropertiesModal(target); break;
    default: break;
  }
}

function launchAppTarget(target, opts = {}) {
  closeOverview();
  let win = null;
  if (target.kind === 'app') {
    win = openApp(target.id);
  } else {
    const item = DESK_ITEMS[target.index];
    if (!item) return null;
    item.action();
    win = openWindows.get(item.appId);
  }
  if (opts.admin && win) {
    markAdmin(win);
    notify('Administrator mode enabled', `${target.name} is now running with elevated privileges.`, targetAppId(target));
  }
  return win;
}

function markAdmin(win) {
  if (!win || win.admin) return;
  win.admin = true;
  const host = win.titleEl && win.titleEl.parentElement;
  if (!host || host.querySelector('.admin-chip')) return;
  const chip = document.createElement('span');
  chip.className = 'admin-chip';
  chip.textContent = 'ADMIN';
  chip.title = 'Running with administrator privileges';
  host.appendChild(chip);
}

/* ---------- modal helpers ---------- */
function showModal(html, setup, focusSel) {
  const layer = $('#appModal');
  const card = layer && $('.modal-card', layer);
  if (!layer || !card) return;
  closeAppCtx();
  closeCtx();
  closePanels();
  card.innerHTML = html;
  layer.classList.add('open');
  layer.setAttribute('aria-hidden', 'false');
  if (typeof setup === 'function') setup(card);
  if (typeof applyI18n === 'function') applyI18n(card);
  setTimeout(() => {
    const el = (focusSel && $(focusSel, card)) || card;
    try {
      el.focus();
      if (focusSel && typeof el.select === 'function') el.select();
    } catch (e) { /* ignore */ }
  }, 70);
}
function closeModal() {
  const layer = $('#appModal');
  if (!layer || !layer.classList.contains('open')) return false;
  layer.classList.remove('open');
  layer.setAttribute('aria-hidden', 'true');
  const card = $('.modal-card', layer);
  setTimeout(() => {
    if (!layer.classList.contains('open') && card) card.innerHTML = '';
  }, 190);
  return true;
}
function modalCloseButton() {
  return `<button class="modal-x" data-modal-close aria-label="Close">${icon('close', 13, 2.2)}</button>`;
}

  const html = `

/* ---------- phone handoff ---------- */
function qrSvg(text) {
  const n = 21;
  let hash = 2166136261;
  for (let i = 0; i < text.length; i++) {
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  let rand = hash >>> 0;
  const next = () => {
    rand = (Math.imul(rand, 1664525) + 1013904223) >>> 0;
    return rand;
  };
  const inFinder = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
  const finderOn = (x, y) => {
    let lx = x;
    let ly = y;
    if (x >= n - 7) lx = x - (n - 7);
    if (y >= n - 7) ly = y - (n - 7);
    return lx === 0 || lx === 6 || ly === 0 || ly === 6 || (lx >= 2 && lx <= 4 && ly >= 2 && ly <= 4);
  };
  let rects = '';
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const on = inFinder(x, y) ? finderOn(x, y) : (next() & 1) === 1;
      if (on) rects += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    }
  }
  return `<svg viewBox="0 0 ${n} ${n}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" fill="#111318" aria-hidden="true">${rects}</svg>`;
}

function openRenameModal(target) {
  const isApp = target.kind === 'app';
  const html = `
    ${modalCloseButton()}
    <div class="modal-icon">${icon('pencil', 21)}</div>
    <h3 class="modal-title">Rename “${esc(target.name)}”</h3>
    <p class="modal-desc">${isApp ? 'The new name appears in the dock, Applications overview and window title.' : 'This changes the label on your desktop. The shortcut still opens the same place.'}</p>
    <form data-rename-form>
      <label class="modal-field"><span>${isApp ? 'Application name' : 'Shortcut name'}</span>
        <input id="renameInput" type="text" maxlength="32" value="${esc(target.name)}" autocomplete="off" spellcheck="false">
      </label>
      <div class="modal-note" data-rename-note>Use a short name — up to 32 characters.</div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-modal-close>Cancel</button>
        <button type="submit" class="btn primary">Rename</button>
      </div>
    </form>`;
  showModal(html, (card) => {
    const form = $('[data-rename-form]', card);
    const input = $('#renameInput', card);
    const note = $('[data-rename-note]', card);
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = input.value.trim();
      if (!name) {
        note.textContent = 'The name cannot be empty.';
        note.classList.add('error');
        input.focus();
        return;
      }
      if (isApp) {
        const old = appName(target.id);
        if (name === APPS[target.id].name) delete S.renames[target.id];
        else S.renames[target.id] = name;
        persist();
        applyAppRename(target.id, old, name);
      } else {
        const base = DESK_ITEMS[target.index].name;
        if (name === base) delete S.deskLabels[base];
        else S.deskLabels[base] = name;
        persist();
        applyDeskRename(target.index, name);
      }
      closeModal();
      notify('Renamed', `“${target.name}” is now “${name}”.`, targetAppId(target), { silent: true });
    });
  }, '#renameInput');
}
function applyAppRename(id, old, name) {
  const dock = $(`#dock .dock-item[data-app="${id}"]`);
  if (dock) {
    dock.dataset.label = name;
    dock.setAttribute('aria-label', name);
    if (typeof i18nForget === 'function') i18nForget(dock);
  }
  const ov = $(`#ovApps .ov-app[data-app="${id}"]`);
  if (ov && ov.lastElementChild) ov.lastElementChild.textContent = name;
  openWindows.forEach((win) => {
    if (win.appId !== id) return;
    win.appName = name;
    if (win.title === old) setWinTitle(win, name);
  });
}
function applyDeskRename(index, name) {
  const el = $(`#desktopIcons .desk-icon[data-desk="${index}"]`);
  if (!el) return;
  el.title = name;
  if (el.lastElementChild) el.lastElementChild.textContent = name;
  if (typeof i18nForget === 'function') i18nForget(el);
}

/* ---------- delete / undo ---------- */
function deleteAppTarget(target) {
  if (target.kind === 'app') {
    const id = target.id;
    const win = openWindows.get(id);
    if (win) closeWin(win);
    state.removedApps.add(id);
    const dock = $(`#dock .dock-item[data-app="${id}"]`);
    const ov = $(`#ovApps .ov-app[data-app="${id}"]`);
    if (dock) dock.hidden = true;
    if (ov) ov.hidden = true;
    notify('Moved to Trash', `${target.name} was removed from the dock and Applications.`, id, {
      action: { label: 'Undo', onClick: () => restoreApp(id) }
    });
  } else {
    const index = target.index;
    state.hiddenDesk.add(index);
    const el = $(`#desktopIcons .desk-icon[data-desk="${index}"]`);
    if (el) {
      el.hidden = true;
      el.classList.remove('selected');
    }
    notify('Removed from desktop', `${target.name} was removed from your desktop. The file was not deleted.`, targetAppId(target), {
      action: { label: 'Undo', onClick: () => restoreDesk(index) }
    });
  }
}
function restoreApp(id) {
  state.removedApps.delete(id);
  const dock = $(`#dock .dock-item[data-app="${id}"]`);
  const ov = $(`#ovApps .ov-app[data-app="${id}"]`);
  if (dock) dock.hidden = false;
  if (ov) ov.hidden = false;
  if (state.overview) {
    const search = $('#ovSearch');
    filterOverview(search ? search.value.trim().toLowerCase() : '');
  }
}
function restoreDesk(index) {
  state.hiddenDesk.delete(index);
  const el = $(`#desktopIcons .desk-icon[data-desk="${index}"]`);
  if (el) el.hidden = false;
}

/* ============================================================
   Language / localization
   ============================================================ */
const LANGUAGES = [
  { id: 'en', code: 'EN', native: 'English', label: 'English' },
  { id: 'zh', code: 'ZH', native: '中文', label: 'Chinese' },
  { id: 'ru', code: 'RU', native: 'Русский', label: 'Russian' },
  { id: 'tg', code: 'TJ', native: 'Тоҷикӣ', label: 'Tajik' },
  { id: 'uz', code: 'UZ', native: 'Oʻzbekcha', label: 'Uzbek' },
  { id: 'es', code: 'ES', native: 'Español', label: 'Spanish' }
];
const LANG_TAGS = { en: 'en', zh: 'zh-CN', ru: 'ru', tg: 'tg', uz: 'uz', es: 'es' };
const TRANSLATIONS = { en: {}, zh: {}, ru: {}, tg: {}, uz: {}, es: {} };

const i18nTextOrigins = new WeakMap();
const i18nAttrOrigins = new WeakMap();
const i18nTemplateCache = new Map();
const I18N_ATTRS = ['title', 'aria-label', 'placeholder', 'data-label', 'alt'];
const I18N_SKIP = '[data-i18n-skip],.term-scroll,.file-item,.file-ghost,textarea,script,style,[contenteditable="true"]';

function currentLang() {
  return S && TRANSLATIONS[S.lang] ? S.lang : 'en';
}
function escapeI18nRegExp(s) {
  return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function compileI18n(lang) {
  const dict = TRANSLATIONS[lang] || {};
  const compiled = [];
  Object.keys(dict).forEach((key) => {
    if (!/\{\d+\}/.test(key)) return;
    const parts = key.split(/(\{\d+\})/);
    let source = '^';
    const order = [];
    parts.forEach((part) => {
      const m = /^\{(\d+)\}$/.exec(part);
      if (m) {
        source += '(.+?)';
        order.push(Number(m[1]));
      } else {
        source += escapeI18nRegExp(part);
      }
    });
    source += '$';
    try { compiled.push({ key, re: new RegExp(source), order }); } catch (e) { /* ignore */ }
  });
  compiled.sort((a, b) => b.key.length - a.key.length);
  return compiled;
}
function tr(text) {
  if (typeof text !== 'string' || !text) return text;
  const lang = currentLang();
  if (lang === 'en') return text;
  const dict = TRANSLATIONS[lang] || {};
  if (Object.prototype.hasOwnProperty.call(dict, text)) return dict[text];
  let compiled = i18nTemplateCache.get(lang);
  if (!compiled) {
    compiled = compileI18n(lang);
    i18nTemplateCache.set(lang, compiled);
  }
  for (const item of compiled) {
    const match = text.match(item.re);
    if (!match) continue;
    return String(dict[item.key]).replace(/\{(\d+)\}/g, (whole, index) => {
      const pos = item.order.indexOf(Number(index));
      if (pos < 0) return whole;
      return tr(match[pos + 1]);
    });

  return text;
}
function i18nSkipNode(el) {
  return !!(el && el.closest && el.closest(I18N_SKIP));
}
function translateTextNode(node) {
  const parent = node.parentElement;
  if (!parent || i18nSkipNode(parent)) return;
  const raw = node.nodeValue;
  if (!raw || !raw.trim()) return;
  let origin = i18nTextOrigins.get(node);
  if (origin === undefined) {
    origin = raw;
    i18nTextOrigins.set(node, origin);
  }
  const core = origin.trim();
  if (!core) return;
  const translated = tr(core);
  const lead = (origin.match(/^\s*/) || [''])[0];

    if (!el.hasAttribute(attr)) return;
    if (!map) {
      map = {};

    }
    if (map[attr] === undefined) map[attr] = el.getAttribute(attr);

  if (!root) return;
  const isElement = root.nodeType === 1;

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let node = walker.nextNode();
  while (node) {
    translateTextNode(node);
    node = walker.nextNode();
  }
  if (isElement) {
    const all = root.querySelectorAll('*');
    for (let i = 0; i < all.length; i++) translateElementAttrs(all[i]);

function i18nForget(el) {

  i18nAttrOrigins.delete(el);
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  let node = walker.nextNode();
  while (node) {
    i18nTextOrigins.delete(node);
    node = walker.nextNode();
  }
  el.querySelectorAll('*').forEach((child) => i18nAttrOrigins.delete(child));
}
function applyLanguage() {
  const lang = TRANSLATIONS[S.lang] ? S.lang : 'en';
  S.lang = lang;
  document.documentElement.lang = LANG_TAGS[lang] || 'en';
  if (typeof tickClock === 'function') tickClock();
  if (typeof syncQuick === 'function') syncQuick();
  if (typeof renderCalendar === 'function') renderCalendar();
  if (typeof renderNotifications === 'function') renderNotifications();
  if (typeof syncSettingsPage === 'function') syncSettingsPage();

function setLanguage(id) {
  if (!TRANSLATIONS[id]) return;
  S.lang = id;

const i18nObserver = new MutationObserver((mutations) => {
  if (currentLang() === 'en') return;
  const roots = [];
  mutations.forEach((mutation) => {
    mutation.addedNodes.forEach((node) => {
      if (node.nodeType === 1 || node.nodeType === 3) roots.push(node);
    });

  roots.forEach((node) => {
