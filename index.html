<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="description" content="Nova OS — a Linux desktop experience running entirely in your browser. Demo build.">
<title>Nova OS — Linux Desktop Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%237a68ff'/%3E%3Cstop offset='1' stop-color='%2320c7b4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M32 12c1.4 12 8.6 19.2 20.6 20.6C40.6 34 33.4 41.2 32 53.2 30.6 41.2 23.4 34 11.4 32.6 23.4 31.2 30.6 24 32 12z' fill='white'/%3E%3C/svg%3E">
<style>
/* Nova OS — browser based Linux desktop demo */
:root{
  --accent:#3584e4;
  --topbar-h:34px;
  --dock-w:76px;
  --font:"Inter","Segoe UI Variable","Segoe UI",Ubuntu,Cantarell,system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code","Ubuntu Mono","SFMono-Regular",Consolas,monospace;
  --danger:#e5484d;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font);background:#07080d;color:var(--text);
  overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
input,textarea{user-select:text}
::selection{background:color-mix(in srgb,var(--accent) 55%,transparent);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(140,145,160,.35);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(140,145,160,.55);background-clip:content-box}
svg{flex:none;display:block}
[hidden]{display:none!important}

body[data-theme="dark"]{
  --surface:#1b1d25;--surface-trans:rgba(27,29,37,.94);
  --surface-2:#23262f;--surface-3:#2b2e39;
  --text:#eef0f6;--muted:#9aa0b0;
  --border:rgba(255,255,255,.09);--border-strong:rgba(255,255,255,.16);
  --hover:rgba(255,255,255,.07);--input:rgba(255,255,255,.06);
  --win-head:rgba(35,38,48,.94);
  --shadow:0 28px 80px rgba(0,0,0,.58),0 2px 10px rgba(0,0,0,.3);
  color-scheme:dark;
}
body[data-theme="light"]{
  --surface:#f7f7fa;--surface-trans:rgba(250,250,252,.95);
  --surface-2:#efeff4;--surface-3:#e3e4ec;
  --text:#17181d;--muted:#696e7c;
  --border:rgba(10,12,20,.08);--border-strong:rgba(10,12,20,.14);
  --hover:rgba(10,12,20,.05);--input:rgba(10,12,20,.05);
  --win-head:rgba(243,243,248,.96);
  --shadow:0 28px 70px rgba(15,20,40,.26),0 2px 10px rgba(15,20,40,.12);
  color-scheme:light;
}

/* ---------- shell ---------- */
#desktop{position:fixed;inset:0;overflow:hidden;isolation:isolate}
.wall-art{
  position:absolute;inset:0;overflow:hidden;background-color:#080a12;
  transition:filter .4s;
}
.wall-art::before{
  content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;
  border:1px solid rgba(255,255,255,.07);right:-14%;top:-24%;
  box-shadow:inset 0 0 140px rgba(120,90,255,.12);
}
.wall-art::after{
  content:"";position:absolute;inset:0;opacity:.16;
  background-image:radial-gradient(rgba(255,255,255,.7) .6px,transparent .7px);
  background-size:26px 26px;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.35) 55%,transparent 90%);
  mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.35) 55%,transparent 90%);
}
.wall-art[data-wall="aurora"]{
  background:
    radial-gradient(62% 62% at 16% 20%,rgba(105,79,255,.66),transparent 63%),
    radial-gradient(60% 58% at 88% 84%,rgba(0,201,181,.43),transparent 66%),
    radial-gradient(48% 46% at 77% 8%,rgba(238,74,180,.28),transparent 62%),
    linear-gradient(155deg,#070a18 0%,#0c1424 55%,#071a1a 100%);
}
.wall-art[data-wall="sage"]{
  background:
    radial-gradient(60% 60% at 18% 12%,rgba(255,255,255,.9),transparent 60%),
    radial-gradient(68% 62% at 86% 82%,rgba(46,158,118,.62),transparent 66%),
    radial-gradient(45% 45% at 72% 20%,rgba(255,244,190,.5),transparent 60%),
    linear-gradient(160deg,#8fbcaa 0%,#d7ece1 52%,#7fae9d 100%);
}
.wall-art[data-wall="ember"]{
  background:
    radial-gradient(66% 62% at 84% 14%,rgba(255,122,61,.48),transparent 62%),
    radial-gradient(72% 60% at 12% 86%,rgba(139,42,95,.62),transparent 66%),
    radial-gradient(40% 40% at 62% 60%,rgba(255,64,90,.16),transparent 60%),
    linear-gradient(155deg,#160a12 0%,#2c0f18 55%,#12080f 100%);
}
#wallpaper{position:absolute;inset:0;z-index:0;animation:wallIn 1.2s ease both}
@keyframes wallIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}

/* ---------- top bar ---------- */
#topbar{
  position:absolute;top:0;left:0;right:0;height:var(--topbar-h);z-index:110;
  display:flex;align-items:center;padding:0 10px;
  background:rgba(8,10,16,.6);backdrop-filter:blur(22px) saturate(1.5);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);
  border-bottom:1px solid rgba(255,255,255,.06);
  color:#fff;font-size:12.5px;
}
.bar-left{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.bar-center{position:absolute;left:50%;transform:translateX(-50%)}
.bar-right{margin-left:auto;display:flex;align-items:center}
.bar-btn{
  border:0;background:none;color:#fff;font:inherit;font-size:12.5px;font-weight:600;
  padding:4px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;
  transition:background .15s;
}
.bar-btn:hover,.bar-btn.active{background:rgba(255,255,255,.13)}
#activitiesBtn{font-weight:650}
#appTitle{
  font-size:12px;font-weight:500;opacity:.8;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:300px;transition:opacity .2s;
}
body.overview-open #appTitle{opacity:0}
.clock-btn{display:flex;gap:9px;align-items:center;font-weight:600;padding:4px 11px}
.clock-date{opacity:.72;font-weight:500}
.quick-btn{
  display:flex;align-items:center;gap:9px;border:0;background:none;color:#fff;
  padding:3px 9px;border-radius:8px;cursor:pointer;transition:background .15s;
}
.quick-btn:hover{background:rgba(255,255,255,.13)}
.status-icon{display:grid;place-items:center}
.status-icon svg{width:15px;height:15px}
.battery-pill{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.01em}
#chevStatus svg{width:12px;height:12px;opacity:.75}
#dndStatus{color:#c8b6ff}

/* ---------- dock ---------- */
#dock{
  position:absolute;z-index:100;display:flex;align-items:center;justify-content:center;
  background:rgba(15,17,24,.52);backdrop-filter:blur(26px) saturate(1.6);
  -webkit-backdrop-filter:blur(26px) saturate(1.6);
  border:1px solid rgba(255,255,255,.11);border-radius:20px;
  box-shadow:0 20px 55px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.08);
}
#dock[data-pos="left"],#dock[data-pos="right"]{
  top:50%;transform:translateY(-50%);flex-direction:column;gap:8px;width:66px;padding:8px 7px;
}
#dock[data-pos="left"]{left:12px}
#dock[data-pos="right"]{right:12px}
#dock[data-pos="top"],#dock[data-pos="bottom"]{
  left:50%;transform:translateX(-50%);flex-direction:row;gap:8px;width:auto;height:auto;padding:7px 8px;
}
#dock[data-pos="top"]{top:calc(var(--topbar-h) + 10px)}
#dock[data-pos="bottom"]{bottom:12px}
.dock-item{
  position:relative;width:50px;height:50px;border:0;background:none;padding:0;
  border-radius:14px;display:grid;place-items:center;cursor:pointer;
  transition:transform .16s cubic-bezier(.2,.8,.3,1.2);
}
.dock-item:hover{transform:translateY(-2px) scale(1.09)}
.dock-item:active{transform:scale(.97)}
.dock-item.active::before{
  content:"";position:absolute;border-radius:99px;background:rgba(255,255,255,.85);
}
#dock[data-pos="left"] .dock-item.active::before,
#dock[data-pos="right"] .dock-item.active::before{
  top:50%;transform:translateY(-50%);width:3px;height:22px;
}
#dock[data-pos="left"] .dock-item.active::before{left:-7px}
#dock[data-pos="right"] .dock-item.active::before{right:-7px}
#dock[data-pos="top"] .dock-item.active::before,
#dock[data-pos="bottom"] .dock-item.active::before{
  left:50%;transform:translateX(-50%);width:20px;height:3px;
}
#dock[data-pos="top"] .dock-item.active::before{top:-7px}
#dock[data-pos="bottom"] .dock-item.active::before{bottom:-7px}
.dock-item .run-dot{
  position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.8);
  opacity:0;transition:opacity .2s;
}
.dock-item.running .run-dot{opacity:1}
.dock-item::after{
  content:attr(data-label);position:absolute;
  background:rgba(18,20,28,.96);border:1px solid rgba(255,255,255,.12);
  color:#fff;font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:7px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:.13s;z-index:20;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}
#dock[data-pos="left"] .dock-item::after{
  left:calc(100% + 14px);top:50%;transform:translateY(-50%) scale(.96);transform-origin:left center;
}
#dock[data-pos="right"] .dock-item::after{
  right:calc(100% + 14px);top:50%;transform:translateY(-50%) scale(.96);transform-origin:right center;
}
#dock[data-pos="top"] .dock-item::after{
  left:50%;top:calc(100% + 12px);transform:translate(-50%,-4px) scale(.96);transform-origin:top center;
}
#dock[data-pos="bottom"] .dock-item::after{
  left:50%;bottom:calc(100% + 12px);transform:translate(-50%,4px) scale(.96);transform-origin:bottom center;
}
#dock[data-pos="left"] .dock-item:hover::after,
#dock[data-pos="right"] .dock-item:hover::after{opacity:1;transform:translateY(-50%) scale(1)}
#dock[data-pos="top"] .dock-item:hover::after,
#dock[data-pos="bottom"] .dock-item:hover::after{opacity:1;transform:translate(-50%,0) scale(1)}
.dock-item.bounce{animation:dockBounce .45s ease}
@keyframes dockBounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-11px)}62%{transform:translateY(2px)}}
.app-tile{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,var(--ta),var(--tb));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 15px rgba(0,0,0,.28);
  flex:none;position:relative;overflow:hidden;
}
.app-tile::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(160deg,rgba(255,255,255,.18),transparent 45%);
  pointer-events:none;
}
.app-tile svg{width:23px;height:23px;position:relative;z-index:1}

/* ---------- desktop icons ---------- */
#desktopIcons{
  position:absolute;top:48px;left:92px;z-index:2;display:grid;
  grid-auto-flow:column;grid-template-rows:repeat(5,104px);gap:4px;
}
body[data-dock="top"] #desktopIcons{top:calc(var(--topbar-h) + 84px)}
.desk-icon{
  width:88px;padding:8px 4px 6px;border-radius:11px;border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;gap:7px;cursor:default;
  background:none;color:#fff;text-align:center;transition:background .12s;
}
.desk-icon:hover{background:rgba(255,255,255,.1)}
.desk-icon.selected{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.18)}
.desk-icon .app-tile{width:50px;height:50px;border-radius:14px}
.desk-icon .app-tile svg{width:26px;height:26px}
.desk-icon span{
  font-size:11.5px;font-weight:500;line-height:1.25;max-width:82px;
  text-shadow:0 1px 4px rgba(0,0,0,.85);word-break:break-word;
}
body[data-wallpaper="sage"] .desk-icon span{color:#10251e;text-shadow:0 1px 2px rgba(255,255,255,.55);font-weight:600}
body[data-wallpaper="sage"] .desk-icon:hover{background:rgba(255,255,255,.3)}
body[data-wallpaper="sage"] .desk-icon.selected{background:rgba(255,255,255,.45);border-color:rgba(0,0,0,.12)}

/* ---------- windows ---------- */
#windows{position:absolute;inset:0;z-index:10;pointer-events:none}
.window{
  position:absolute;display:flex;flex-direction:column;overflow:hidden;pointer-events:auto;
  background:var(--surface-trans);color:var(--text);
  border:1px solid var(--border-strong);border-radius:14px;
  box-shadow:0 12px 34px rgba(0,0,0,.32);
  backdrop-filter:blur(30px) saturate(1.25);-webkit-backdrop-filter:blur(30px) saturate(1.25);
  animation:winIn .2s cubic-bezier(.2,.75,.3,1);
  transition:opacity .17s,transform .17s,box-shadow .2s;
}
.window.focused{box-shadow:var(--shadow);border-color:rgba(255,255,255,.18)}
body[data-theme="light"] .window.focused{border-color:rgba(10,12,20,.18)}
.window.animating{transition:left .22s ease,top .22s ease,width .22s ease,height .22s ease,opacity .17s,transform .17s}
.window.minimized{opacity:0;transform:scale(.88) translateY(26px);pointer-events:none}
.window.closing{opacity:0;transform:scale(.965);transition:opacity .15s,transform .15s}
.window.maximized{border-radius:0}
.window.maximized .resize-handle{display:none}
@keyframes winIn{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:none}}
.win-header{
  height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 9px 0 14px;
  background:var(--win-head);border-bottom:1px solid var(--border);
  cursor:default;touch-action:none;
}
.win-title{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-title .app-tile{width:22px;height:22px;border-radius:6px;box-shadow:none}
.win-title .app-tile svg{width:12px;height:12px}
.win-controls{display:flex;gap:6px;flex:none}
.win-btn{
  width:26px;height:26px;border-radius:50%;border:0;background:var(--input);color:var(--muted);
  display:grid;place-items:center;cursor:pointer;transition:.13s;
}
.win-btn svg{width:12px;height:12px}
.win-btn:hover{background:var(--hover);color:var(--text)}
.win-btn.close:hover{background:#e01b24;color:#fff}
.win-body{flex:1;min-height:0;position:relative;overflow:hidden;display:flex}
body.dragging{cursor:grabbing}
body.dragging .window{transition:none!important}
.resize-handle{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:4}
.resize-handle::after{
  content:"";position:absolute;right:4px;bottom:4px;width:8px;height:8px;
  border-right:2px solid var(--border-strong);border-bottom:2px solid var(--border-strong);
  border-radius:0 0 2px 0;opacity:.6;
}

/* ---------- overview ---------- */
#overview{
  position:absolute;inset:0;z-index:80;padding:64px 30px 110px;
  display:flex;flex-direction:column;align-items:center;overflow:auto;
  background:rgba(7,9,16,.56);backdrop-filter:blur(30px) saturate(1.25);
  -webkit-backdrop-filter:blur(30px) saturate(1.25);color:#fff;
  opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s;
}
#overview.open{opacity:1;visibility:visible}
.ov-inner{width:100%;display:flex;flex-direction:column;align-items:center}
.ov-search{
  width:min(560px,94%);display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  border-radius:13px;padding:11px 15px;backdrop-filter:blur(12px);
  box-shadow:0 10px 34px rgba(0,0,0,.2);
}
.ov-search svg{width:17px;height:17px;opacity:.65}
.ov-search input{
  flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:13.5px;
}
.ov-search input::placeholder{color:rgba(255,255,255,.55)}
.ov-section{
  width:min(960px,100%);margin-top:26px;display:flex;align-items:center;gap:10px;
  font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:rgba(255,255,255,.52);
}
.ov-windows{width:min(960px,100%);margin-top:11px;display:flex;flex-wrap:wrap;gap:8px}
.ov-win{
  display:flex;align-items:center;gap:9px;min-width:170px;max-width:260px;
  padding:7px 8px;border-radius:10px;cursor:pointer;text-align:left;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  color:#fff;font:inherit;font-size:11.5px;transition:.14s;
}
.ov-win:hover{background:rgba(255,255,255,.15);transform:translateY(-1px)}
.ov-win .app-tile{width:26px;height:26px;border-radius:7px;box-shadow:none}
.ov-win .app-tile svg{width:14px;height:14px}
.ov-win .ov-win-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-win .ov-win-close{
  width:20px;height:20px;border:0;background:none;color:rgba(255,255,255,.5);
  border-radius:5px;display:grid;place-items:center;cursor:pointer;flex:none;
}
.ov-win .ov-win-close:hover{background:rgba(255,255,255,.15);color:#fff}
.ov-win .ov-win-close svg{width:11px;height:11px}
.ov-apps{
  width:min(960px,100%);margin-top:12px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:10px;
}
.ov-app{
  display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 8px 13px;
  border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);
  color:#fff;font:inherit;cursor:pointer;transition:.15s;
}
.ov-app:hover{background:rgba(255,255,255,.14);transform:translateY(-2px);border-color:rgba(255,255,255,.16)}
.ov-app .app-tile{width:56px;height:56px;border-radius:16px}
.ov-app .app-tile svg{width:28px;height:28px}
.ov-app span{font-size:12px;font-weight:500}
.ov-empty{margin-top:30px;font-size:12.5px;color:rgba(255,255,255,.55)}

/* ---------- panels ---------- */
.panel{
  position:absolute;top:calc(var(--topbar-h) + 8px);right:10px;z-index:130;
  background:var(--surface-trans);color:var(--text);
  border:1px solid var(--border-strong);border-radius:16px;
  box-shadow:var(--shadow);backdrop-filter:blur(32px) saturate(1.3);
  -webkit-backdrop-filter:blur(32px) saturate(1.3);
  opacity:0;transform:translateY(-7px) scale(.975);transform-origin:top right;
  pointer-events:none;transition:opacity .16s,transform .16s;
}
.panel.open{opacity:1;transform:none;pointer-events:auto}
#quickPanel{width:334px;padding:12px}
#calendarPanel{width:352px;padding:14px}

.qs-head{display:flex;align-items:center;gap:10px;padding:3px 3px 12px}
.avatar-sm{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,var(--accent),#9b59f6);color:#fff;
  font-size:11.5px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.3);
}
.qs-name{font-weight:600;font-size:12.5px;line-height:1.3}
.qs-sub{font-size:10px;color:var(--muted);margin-top:1px}
.qs-actions{margin-left:auto;display:flex;gap:3px}
.icon-btn{
  width:31px;height:31px;border-radius:9px;border:0;background:none;color:var(--muted);
  display:grid;place-items:center;cursor:pointer;transition:.13s;
}
.icon-btn svg{width:16px;height:16px}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.qs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qs-tile{
  display:flex;align-items:center;gap:9px;padding:9px;border-radius:12px;text-align:left;
  border:1px solid transparent;background:var(--input);color:var(--text);
  font:inherit;cursor:pointer;transition:.15s;
}
.qs-tile:hover{filter:brightness(1.1)}
.qs-tile .ic{
  width:30px;height:30px;border-radius:9px;background:var(--surface-3);color:var(--muted);
  display:grid;place-items:center;flex:none;transition:.15s;
}
.qs-tile .ic svg{width:16px;height:16px}
.qs-tile b{display:block;font-size:11.5px;font-weight:600;line-height:1.25}
.qs-tile small{display:block;font-size:10px;color:var(--muted);line-height:1.3;margin-top:1px}
.qs-tile.on{background:color-mix(in srgb,var(--accent) 24%,var(--surface));border-color:color-mix(in srgb,var(--accent) 38%,transparent)}
.qs-tile.on .ic{background:var(--accent);color:#fff}
.qs-tile.on small{color:color-mix(in srgb,var(--text) 70%,transparent)}
.qs-sliders{padding:8px 3px 2px;display:flex;flex-direction:column;gap:2px}
.qs-slider{display:flex;align-items:center;gap:10px;padding:7px 0}
.qs-slider svg{width:15px;height:15px;color:var(--muted)}
input[type="range"]{
  -webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:99px;outline:none;
  background:linear-gradient(to right,var(--accent) var(--fill,72%),var(--surface-3) var(--fill,72%));
  cursor:pointer;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;
  border:1px solid rgba(0,0,0,.2);box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer;
}
input[type="range"]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}
.qs-battery{
  display:flex;align-items:center;gap:8px;margin-top:5px;padding:9px 4px 0;
  border-top:1px solid var(--border);font-size:10.5px;color:var(--muted);
}
.qs-battery svg{width:17px;height:17px}
.hz-badge{
  margin-left:auto;flex:none;font-size:8.5px;font-weight:800;letter-spacing:.04em;
  color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);
  padding:3px 6px;border-radius:5px;
}
.qs-footer{display:flex;gap:6px;margin-top:9px}
.qs-footer .btn{flex:1;justify-content:center;padding:7px 4px;font-size:11px}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);
  background:var(--input);color:var(--text);padding:8px 12px;border-radius:9px;
  font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:.14s;white-space:nowrap;
}
.btn svg{width:14px;height:14px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 14%,transparent)}
.btn.small{padding:5px 9px;font-size:10.5px;border-radius:7px}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:0 2px}
.cal-title{font-size:13px;font-weight:700;flex:1}
.cal-nav{width:27px;height:27px;border-radius:7px;border:0;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.cal-nav:hover{background:var(--hover);color:var(--text)}
.cal-nav svg{width:14px;height:14px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}
.cal-week span{text-align:center;font-size:9.5px;font-weight:700;color:var(--muted);padding:3px 0;text-transform:uppercase;letter-spacing:.04em}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{
  height:32px;display:grid;place-items:center;font-size:11px;border-radius:8px;
  color:var(--text);font-weight:500;
}
.cal-day.muted{color:var(--muted);opacity:.45}
.cal-day.other{color:var(--muted);opacity:.38}
.cal-day.today{background:var(--accent);color:#fff;font-weight:700;box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 45%,transparent)}
.cal-day:hover:not(.today){background:var(--hover)}
.notif-head{
  display:flex;align-items:center;margin-top:14px;padding:11px 2px 6px;
  border-top:1px solid var(--border);font-size:10px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
}
.notif-head span{flex:1}
.notif-clear{border:0;background:none;color:var(--muted);font:inherit;font-size:9.5px;font-weight:600;cursor:pointer;padding:2px 5px;border-radius:5px}
.notif-clear:hover{background:var(--hover);color:var(--text)}
.notif-list{display:flex;flex-direction:column;gap:4px;max-height:198px;overflow:auto;padding:2px;margin:0 -2px}
.notif{
  display:flex;gap:9px;padding:8px;border-radius:9px;cursor:pointer;border:1px solid transparent;
  background:var(--input);align-items:flex-start;text-align:left;color:var(--text);font:inherit;
}
.notif:hover{background:var(--hover)}
.notif .app-tile{width:26px;height:26px;border-radius:7px;box-shadow:none}
.notif .app-tile svg{width:13px;height:13px}
.notif .n-body{min-width:0;flex:1}
.notif b{display:block;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notif p{margin:2px 0 0;font-size:10px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.notif time{font-size:9px;color:var(--muted);opacity:.8;margin-top:3px;display:block}
.notif-empty{padding:18px 8px 12px;text-align:center;font-size:11px;color:var(--muted)}
.notif-empty svg{width:22px;height:22px;margin:0 auto 7px;opacity:.4}

/* ---------- toasts ---------- */
#toasts{position:fixed;top:calc(var(--topbar-h) + 10px);right:12px;z-index:320;width:min(340px,calc(100vw - 24px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  pointer-events:auto;display:flex;gap:10px;padding:11px;align-items:flex-start;
  background:var(--surface-trans);color:var(--text);border:1px solid var(--border-strong);
  border-radius:13px;box-shadow:var(--shadow);backdrop-filter:blur(26px) saturate(1.3);
  animation:toastIn .26s cubic-bezier(.2,.8,.3,1);
}
.toast.out{animation:toastOut .2s forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(26px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(22px) scale(.98)}}
.toast .app-tile{width:32px;height:32px;border-radius:9px;box-shadow:none}
.toast .app-tile svg{width:16px;height:16px}
.toast .t-body{flex:1;min-width:0}
.toast b{display:block;font-size:12px;font-weight:600}
.toast p{margin:2px 0 0;font-size:11px;line-height:1.4;color:var(--muted)}
.toast .t-close{width:20px;height:20px;border:0;background:none;color:var(--muted);border-radius:5px;display:grid;place-items:center;cursor:pointer;flex:none}
.toast .t-close:hover{background:var(--hover);color:var(--text)}
.toast .t-close svg{width:11px;height:11px}

/* ---------- context menu ---------- */
#ctxMenu,#appCtx{
  position:fixed;z-index:340;min-width:218px;padding:6px;color:var(--text);
  background:var(--surface-trans);border:1px solid var(--border-strong);border-radius:11px;
  box-shadow:var(--shadow);backdrop-filter:blur(28px) saturate(1.3);
  opacity:0;visibility:hidden;transform:scale(.97);transform-origin:top left;
  transition:opacity .12s,transform .12s,visibility .12s;
}
#ctxMenu.open,#appCtx.open{opacity:1;visibility:visible;transform:none}
.ctx-item{
  display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:7px;
  font-size:11.5px;cursor:pointer;color:var(--text);
}
.ctx-item svg{width:14px;height:14px;color:var(--muted)}
.ctx-item:hover{background:var(--hover)}
.ctx-item:hover svg{color:var(--text)}
.ctx-sep{height:1px;background:var(--border);margin:5px 7px}

/* ---------- overlays / boot / auth ---------- */
.overlay-screen{
  position:fixed;inset:0;z-index:400;display:grid;place-items:center;
  background:#05060b;color:#fff;transition:opacity .55s ease,visibility .55s ease;
}
.overlay-screen.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
#boot{z-index:460;background:radial-gradient(60% 60% at 50% 45%,#12132a 0%,#070810 62%,#030409 100%)}
.boot-inner{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px}
.nova-logo{
  width:86px;height:86px;border-radius:24px;display:grid;place-items:center;
  background:linear-gradient(145deg,#7a68ff,#20c7b4);color:#fff;
  box-shadow:0 0 70px rgba(112,94,255,.45),inset 0 1px 0 rgba(255,255,255,.35);
  animation:logoPulse 2.6s ease-in-out infinite;
}
.nova-logo svg{width:46px;height:46px}
.nova-logo.small{width:54px;height:54px;border-radius:15px;animation:none;box-shadow:0 10px 30px rgba(112,94,255,.3)}
.nova-logo.small svg{width:28px;height:28px}
@keyframes logoPulse{0%,100%{box-shadow:0 0 60px rgba(112,94,255,.35),inset 0 1px 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 100px rgba(40,220,200,.45),inset 0 1px 0 rgba(255,255,255,.35)}}
.boot-name{font-size:23px;font-weight:700;letter-spacing:.01em;margin-top:8px}
.boot-sub{font-size:11.5px;color:rgba(255,255,255,.48);letter-spacing:.02em}
.boot-emblem{position:relative;width:136px;height:136px;display:grid;place-items:center;margin-bottom:2px}
.boot-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.boot-ring circle{fill:none;stroke-width:3.5;stroke-linecap:round}
.boot-ring-track{stroke:rgba(255,255,255,.09)}
.boot-ring-fill{
  stroke:url(#bootRingGrad);stroke-dasharray:339.3;stroke-dashoffset:339.3;
  animation:bootRing 1.55s cubic-bezier(.3,.7,.35,1) forwards;
  filter:drop-shadow(0 0 5px rgba(80,220,205,.35));
}
@keyframes bootRing{to{stroke-dashoffset:0}}

#auth{z-index:440;background:#080a12;display:flex;align-items:center;justify-content:center;overflow:hidden}
.auth-bg{filter:brightness(.62) saturate(1.08);transform:scale(1.03)}
.auth-scrim{
  position:absolute;inset:0;z-index:1;
  background:radial-gradient(circle at 50% 38%,rgba(4,6,12,.1) 0%,rgba(4,6,12,.62) 68%,rgba(2,3,7,.85) 100%);
}
.auth-top{position:absolute;top:6.5vh;left:50%;transform:translateX(-50%);text-align:center;z-index:2;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.auth-time{font-size:64px;font-weight:200;letter-spacing:-.035em;line-height:1.02}
.auth-date{font-size:13.5px;color:rgba(255,255,255,.68);margin-top:6px;font-weight:500}
.auth-card{
  position:relative;z-index:2;width:340px;max-width:calc(100vw - 40px);
  display:flex;flex-direction:column;align-items:center;margin-top:7vh;
}
.auth-avatar{
  width:88px;height:88px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,#6d5efc,#25c9b7);color:#fff;
  font-size:26px;font-weight:700;letter-spacing:.02em;
  box-shadow:0 0 0 1px rgba(255,255,255,.3),0 20px 50px rgba(0,0,0,.5);
}
.auth-name{font-size:19px;font-weight:600;margin-top:14px;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.auth-hint{font-size:11.5px;color:rgba(255,255,255,.52);text-align:center;margin-top:4px;min-height:16px;line-height:1.45}
.auth-field{
  margin-top:13px;width:100%;display:flex;align-items:center;gap:4px;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.24);
  border-radius:12px;padding:4px 4px 4px 15px;backdrop-filter:blur(16px);
  box-shadow:0 12px 34px rgba(0,0,0,.28);transition:border-color .2s,background .2s;
}
.auth-field:focus-within{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.18)}
.auth-field input{
  flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:13px;
  height:38px;letter-spacing:.06em;min-width:0;
}
.auth-field input::placeholder{color:rgba(255,255,255,.48);letter-spacing:.02em}
.auth-go{
  width:34px;height:34px;border-radius:9px;border:0;background:rgba(255,255,255,.94);
  color:#111;display:grid;place-items:center;cursor:pointer;transition:.15s;flex:none;
}
.auth-go:hover{background:#fff;transform:scale(1.04)}
.auth-go svg{width:17px;height:17px}
.auth-footer{
  position:absolute;bottom:24px;left:0;right:0;text-align:center;z-index:2;
  font-size:10.5px;color:rgba(255,255,255,.4);letter-spacing:.01em;
}
.auth-badge{
  position:absolute;top:22px;right:24px;z-index:2;display:flex;align-items:center;gap:7px;
  font-size:10.5px;color:rgba(255,255,255,.55);background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);padding:5px 9px;border-radius:99px;
}
.auth-badge svg{width:12px;height:12px}

/* ---------- power ---------- */
#power{z-index:500;background:#030407}
.power-inner{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px}
.power-orb{
  width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  color:rgba(255,255,255,.8);margin-bottom:8px;
  animation:powerPulse 1.8s ease-in-out infinite;
}
.power-orb svg{width:26px;height:26px}
@keyframes powerPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.08)}50%{box-shadow:0 0 0 16px rgba(255,255,255,0)}}
.power-actions{display:flex;gap:8px;margin-top:18px}
.power-actions .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}
.power-actions .btn:hover{background:rgba(255,255,255,.18)}

/* ---------- night light / brightness ---------- */
#nightlight{
  position:fixed;inset:0;z-index:240;pointer-events:none;opacity:0;transition:opacity .35s;
  background:linear-gradient(180deg,rgba(255,168,72,.14),rgba(255,120,40,.09));
}
body.nightlight #nightlight{opacity:1}
body.nightlight #wallpaper,body.nightlight .auth-bg{filter:sepia(.24) saturate(1.15) hue-rotate(-8deg) brightness(.97)}
#dim{position:fixed;inset:0;z-index:270;pointer-events:none;background:#000;opacity:0;transition:opacity .2s}

/* reduced motion */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}

/* ---------- files app ---------- */
.files-app{display:flex;width:100%;height:100%;background:var(--surface);min-width:0}
.files-side{
  width:174px;flex:none;background:var(--surface-2);border-right:1px solid var(--border);
  padding:10px 8px;display:flex;flex-direction:column;gap:2px;min-height:0;
}
.side-head{
  font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);padding:8px 10px 5px;opacity:.85;
}
.side-item{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;
  font-size:11.5px;color:var(--muted);cursor:default;border:0;background:none;
  font:inherit;text-align:left;transition:.12s;width:100%;
}
.side-item svg{width:15px;height:15px}
.side-item:hover{background:var(--hover);color:var(--text)}
.side-item.active{background:var(--input);color:var(--text);font-weight:600}
.side-item.trash{margin-top:6px;border-top:1px solid var(--border);border-radius:0 0 8px 8px;padding-top:9px}
.side-storage{margin-top:auto;padding:11px 10px 5px;border-top:1px solid var(--border);font-size:9.5px;color:var(--muted)}
.storage-bar{height:4px;border-radius:9px;background:var(--surface-3);margin-top:6px;overflow:hidden}
.storage-bar span{display:block;height:100%;width:61%;background:var(--accent);border-radius:9px}
.files-main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--surface)}
.files-toolbar{height:47px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px;border-bottom:1px solid var(--border)}
.nav-btn{
  width:28px;height:28px;border-radius:7px;border:0;background:none;color:var(--muted);
  display:grid;place-items:center;cursor:pointer;flex:none;transition:.12s;
}
.nav-btn svg{width:15px;height:15px}
.nav-btn:hover:not(:disabled){background:var(--hover);color:var(--text)}
.nav-btn:disabled{opacity:.3;cursor:default}
.crumbs{display:flex;align-items:center;gap:1px;min-width:0;overflow:hidden;margin-left:3px}
.crumb{
  border:0;background:none;color:var(--muted);font:inherit;font-size:11.5px;font-weight:600;
  padding:4px 6px;border-radius:6px;cursor:pointer;white-space:nowrap;
}
.crumb:hover{background:var(--hover);color:var(--text)}
.crumb:last-child{color:var(--text);background:var(--input)}
.crumb-sep{color:var(--muted);opacity:.45;font-size:10px;flex:none}
.files-search{
  margin-left:auto;width:170px;flex:none;display:flex;align-items:center;gap:6px;
  background:var(--input);border-radius:8px;padding:0 9px;height:28px;
}
.files-search svg{width:13px;height:13px;color:var(--muted)}
.files-search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:11px}
.files-search input::placeholder{color:var(--muted)}
.files-grid{
  flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));
  grid-auto-rows:108px;gap:4px;align-content:start;
}
.file-item{
  display:flex;flex-direction:column;align-items:center;gap:7px;padding:9px 5px 6px;
  border-radius:9px;cursor:default;text-align:center;border:1px solid transparent;min-width:0;
}
.file-item:hover{background:var(--hover)}
.file-item.selected{background:color-mix(in srgb,var(--accent) 20%,transparent);border-color:color-mix(in srgb,var(--accent) 42%,transparent)}
.file-item.file-drag-source{opacity:.38}
.file-item.file-drop-target{
  background:color-mix(in srgb,var(--accent) 22%,transparent);
  border-color:color-mix(in srgb,var(--accent) 58%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 44%,transparent);
}
.file-item.file-drop-target .f-ic{transform:scale(1.1)}
.side-item.file-drop-target,
.crumb.file-drop-target{
  background:color-mix(in srgb,var(--accent) 24%,transparent);
  color:var(--text);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 52%,transparent);
}
.file-ghost{
  position:fixed;left:0;top:0;z-index:9999;width:96px;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:7px;padding:9px 5px 8px;
  border-radius:10px;background:color-mix(in srgb,var(--surface) 88%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 38%,var(--border));
  box-shadow:0 14px 34px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);
  opacity:.94;will-change:transform;backdrop-filter:blur(4px);
}
.file-ghost .f-name{font-size:11px;line-height:1.25;max-height:2.55em;overflow:hidden;word-break:break-word;text-align:center;color:var(--text)}
body.file-drag-active .file-item,
body.file-drag-active .files-grid,
body.file-drag-active .side-item,
body.file-drag-active .crumb{cursor:grabbing}
.f-ic{
  width:43px;height:43px;border-radius:11px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,var(--fa),var(--fb));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 4px 10px rgba(0,0,0,.18);
  transition:transform .13s ease;
}
.f-ic svg{width:22px;height:22px}
.f-name{font-size:11px;line-height:1.25;max-height:2.55em;overflow:hidden;word-break:break-word;color:var(--text)}
.f-meta{font-size:9px;color:var(--muted);margin-top:-3px}
.files-empty{
  grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;min-height:180px;color:var(--muted);gap:9px;font-size:11.5px;text-align:center;
}
.files-empty svg{width:38px;height:38px;opacity:.35}
.files-empty b{font-size:12.5px;color:var(--text);font-weight:600}
.files-status{
  height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;border-top:1px solid var(--border);background:var(--surface-2);
  font-size:9.5px;color:var(--muted);
}

/* ---------- terminal ---------- */
.term{
  width:100%;height:100%;display:flex;flex-direction:column;background:#0b0c11;
  font-family:var(--mono);font-size:12.5px;color:#d7dde8;min-width:0;
}
.term-scroll{flex:1;overflow-y:auto;padding:13px 16px 16px;line-height:1.55;user-select:text}
.term-line{white-space:pre-wrap;word-break:break-word;min-height:19px}
.term-line.pad{padding-top:5px}
.term .green{color:#7ee787}
.term .cyan{color:#69d9ff}
.term .dim{color:#707a8d}
.term .yellow{color:#ffd479}
.term .red{color:#ff7b72}
.term .violet{color:#b99cff}
.term .white{color:#f0f4fa;font-weight:600}
.term .link{color:#69d9ff;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.term-input-line{display:flex;gap:8px;align-items:center;line-height:1.55}
.term-prompt{white-space:nowrap;color:#7ee787}
.term-input{
  flex:1;min-width:0;background:none;border:0;outline:0;color:#e6ebf3;font:inherit;
  padding:0;caret-color:#7ee787;
}
.term-hint{color:#596173;font-size:10.5px;padding:0 16px 10px;flex:none}
.term-hint kbd{
  font-family:inherit;background:#171a23;border:1px solid #282c38;border-bottom-width:2px;
  padding:1px 5px;border-radius:4px;color:#9aa3b5;font-size:9px;
}

/* ---------- editor ---------- */
.editor{width:100%;height:100%;display:flex;flex-direction:column;background:var(--surface);min-width:0}
.ed-bar{
  height:41px;flex:none;display:flex;align-items:center;gap:9px;padding:0 12px;
  border-bottom:1px solid var(--border);background:var(--surface-2);
}
.ed-file{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;min-width:0}
.ed-file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.ed-status{font-size:10px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:5px;white-space:nowrap}
.ed-status svg{width:12px;height:12px;color:var(--accent)}
.editor textarea{
  flex:1;min-height:0;width:100%;resize:none;border:0;outline:0;
  background:var(--surface);color:var(--text);padding:18px 22px;
  font-family:var(--mono);font-size:12.5px;line-height:1.72;tab-size:2;
}
.editor textarea::selection{background:color-mix(in srgb,var(--accent) 40%,transparent)}
.ed-foot{
  height:26px;flex:none;display:flex;gap:16px;align-items:center;padding:0 12px;
  border-top:1px solid var(--border);background:var(--surface-2);font-size:9.5px;color:var(--muted);
}

/* ---------- calculator ---------- */
.calc{width:100%;height:100%;display:flex;flex-direction:column;background:var(--surface);padding:12px;gap:10px}
.calc-display{
  background:var(--surface-2);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;text-align:right;display:flex;flex-direction:column;gap:3px;
  min-height:94px;justify-content:flex-end;overflow:hidden;
}
.calc-expr{font-size:11px;color:var(--muted);min-height:14px;word-break:break-all;line-height:1.3}
.calc-result{font-size:29px;font-weight:300;letter-spacing:-.025em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:7px}
.calc-key{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  border-radius:10px;font:inherit;font-size:16px;font-weight:500;cursor:pointer;transition:.1s;
}
.calc-key:hover{background:var(--surface-3)}
.calc-key:active{transform:scale(.96)}
.calc-key.op{color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,var(--surface-2));font-size:18px}
.calc-key.op:hover{background:color-mix(in srgb,var(--accent) 18%,var(--surface-2))}
.calc-key.fn{font-size:13px;color:var(--muted)}
.calc-key.zero{grid-column:span 2}
.calc-key.eq{background:var(--accent);border-color:transparent;color:#fff;font-size:19px;box-shadow:0 5px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.calc-key.eq:hover{filter:brightness(1.08);background:var(--accent)}

/* ---------- monitor ---------- */
.mon{width:100%;height:100%;overflow:auto;background:var(--surface);padding:15px;display:flex;flex-direction:column;gap:11px}
.mon-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;flex:none}
.mon-card{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:10px 12px}
.mon-card .lbl{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.mon-card .val{font-size:21px;font-weight:600;margin-top:2px;letter-spacing:-.01em}
.mon-card .sub{font-size:9.5px;color:var(--muted);margin-top:1px}
.mon-card .bar{height:4px;background:var(--surface-3);border-radius:9px;margin-top:7px;overflow:hidden}
.mon-card .bar span{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .45s}
.mon-card.mem .bar span{background:#20b2a6}
.mon-chart{
  background:var(--surface-2);border:1px solid var(--border);border-radius:11px;
  padding:11px 13px;flex:none;height:228px;display:flex;flex-direction:column;
}
.mon-chart-head{display:flex;align-items:center;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.mon-legend{display:flex;gap:13px;font-size:9.5px;color:var(--muted);margin-left:auto;font-weight:500}
.mon-legend i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
.mon-canvas-wrap{flex:1;min-height:0;margin-top:7px;position:relative}
.mon-canvas-wrap canvas{width:100%;height:100%;display:block}
.mon-proc{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;overflow:hidden;flex:none}
.mon-proc-head{display:grid;grid-template-columns:1fr 64px 64px;padding:8px 13px;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border)}
.mon-proc-head span:not(:first-child){text-align:right}
.proc-row{display:grid;grid-template-columns:1fr 64px 64px;padding:6px 13px;font-size:10.5px;align-items:center;border-bottom:1px solid var(--border)}
.proc-row:last-child{border-bottom:0}
.proc-row .pname{display:flex;align-items:center;gap:8px;min-width:0}
.proc-row .pname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proc-row .pdot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.proc-row .pnum{text-align:right;font-family:var(--mono);font-size:10px;color:var(--muted)}

/* ---------- settings ---------- */
.settings{display:flex;width:100%;height:100%;background:var(--surface);min-width:0}
.set-side{width:190px;flex:none;background:var(--surface-2);border-right:1px solid var(--border);padding:13px 9px;display:flex;flex-direction:column;gap:3px}
.set-side-head{padding:4px 10px 12px;font-size:13px;font-weight:700}
.set-nav{
  display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:8px;
  font:inherit;font-size:11.5px;color:var(--muted);cursor:pointer;border:0;background:none;
  text-align:left;width:100%;transition:.12s;
}
.set-nav svg{width:15px;height:15px}
.set-nav:hover{background:var(--hover);color:var(--text)}
.set-nav.active{background:var(--input);color:var(--text);font-weight:600}
.set-main{flex:1;overflow:auto;padding:22px 26px;min-width:0}
.set-title{font-size:18px;font-weight:700;margin:0 0 3px;letter-spacing:-.01em}
.set-sub{font-size:11px;color:var(--muted);margin:0 0 17px;line-height:1.5}
.set-group{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:2px 14px;margin-bottom:13px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:0}
.set-row .info b{font-size:11.5px;display:block;font-weight:600}
.set-row .info p{font-size:10px;color:var(--muted);margin:2px 0 0;line-height:1.4}
.seg{display:flex;background:var(--surface-3);border-radius:8px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:10.5px;font-weight:600;padding:5px 12px;border-radius:6px;cursor:pointer}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.dock-pos{display:flex;gap:4px;padding:3px;background:var(--surface-3);border-radius:9px;flex:none}
.dock-pos button{position:relative;width:32px;height:28px;border:0;background:transparent;border-radius:6px;cursor:pointer;padding:0}
.dock-pos button::after{
  content:"";position:absolute;inset:5px;border:1px solid var(--border-strong);
  border-radius:3px;opacity:.7;transition:.15s;
}
.dock-pos button::before{
  content:"";position:absolute;background:var(--muted);border-radius:2px;opacity:.6;
  transition:.15s;z-index:1;
}
.dock-pos button[data-dock-pos="left"]::before{left:6px;top:8px;bottom:8px;width:3px}
.dock-pos button[data-dock-pos="right"]::before{right:6px;top:8px;bottom:8px;width:3px}
.dock-pos button[data-dock-pos="top"]::before{top:6px;left:8px;right:8px;height:3px}
.dock-pos button[data-dock-pos="bottom"]::before{bottom:6px;left:8px;right:8px;height:3px}
.dock-pos button:hover::before{opacity:.9}
.dock-pos button.active{background:var(--surface)}
.dock-pos button.active::after{border-color:color-mix(in srgb,var(--accent) 45%,var(--border-strong))}
.dock-pos button.active::before{background:var(--accent);opacity:1;box-shadow:0 0 6px color-mix(in srgb,var(--accent) 55%,transparent)}
.set-select-wrap{position:relative;flex:none}
.set-select-wrap::after{
  content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;
  border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);
  transform:translateY(-70%) rotate(45deg);pointer-events:none;
}
.set-select{
  appearance:none;-webkit-appearance:none;padding:7px 30px 7px 11px;border-radius:8px;
  border:1px solid var(--border-strong);background:var(--surface-3);color:var(--text);
  font:inherit;font-size:11px;font-weight:600;cursor:pointer;outline:none;
}
.set-select:hover{background:var(--surface-2)}
.set-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.set-value{font-size:11px;font-weight:600;color:var(--muted);flex:none}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lang-choice{
  display:flex;align-items:center;gap:11px;padding:11px;text-align:left;
  background:var(--surface-2);border:1px solid var(--border);border-radius:11px;
  color:var(--text);font:inherit;cursor:pointer;transition:.14s;min-width:0;
}
.lang-choice:hover{background:var(--surface-3);border-color:var(--border-strong)}
.lang-choice.active{
  border-color:color-mix(in srgb,var(--accent) 55%,transparent);
  background:color-mix(in srgb,var(--accent) 10%,var(--surface-2));
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 16%,transparent);
}
.lang-code{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:var(--input);font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--muted);
}
.lang-choice.active .lang-code{background:var(--accent);color:#fff}
.lang-meta{flex:1;min-width:0}
.lang-meta b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang-meta span{display:block;font-size:9.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang-check{color:var(--accent);flex:none;display:grid;place-items:center}
.lang-check svg{width:13px;height:13px}
.swatches{display:flex;gap:7px;flex:none}
.swatch{
  width:21px;height:21px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;
  transition:transform .12s;position:relative;
}
.swatch:hover{transform:scale(1.12)}
.swatch.active{box-shadow:0 0 0 2px var(--surface-2),0 0 0 3px var(--text)}
.wall-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:11px}
.wall-choice{
  border:2px solid transparent;border-radius:9px;padding:0;overflow:hidden;cursor:pointer;
  background:var(--surface-3);position:relative;aspect-ratio:16/9;
}
.wall-choice.active{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.wall-choice .wall-art{position:absolute;inset:0}
.wall-choice span{
  position:absolute;left:0;right:0;bottom:0;padding:5px 7px;font-size:8.5px;font-weight:600;
  color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.68));z-index:2;
}
.wall-row{display:block!important}
.switch{
  width:38px;height:22px;border-radius:99px;background:var(--surface-3);border:1px solid var(--border);
  position:relative;cursor:pointer;flex:none;transition:.18s;padding:0;
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:var(--muted);transition:.18s;
}
.switch.on{background:var(--accent);border-color:transparent}
.switch.on::after{left:18px;background:#fff}
.set-slider{display:flex;align-items:center;gap:9px;width:230px;flex:none}
.set-slider svg{width:15px;height:15px;color:var(--muted);flex:none}
.set-slider input{flex:1;min-width:0}
.set-slider span{font-size:10px;color:var(--muted);width:26px;text-align:right;flex:none}
.about-hero{display:flex;align-items:center;gap:16px;margin:4px 0 17px}
.about-logo{
  width:64px;height:64px;border-radius:18px;display:grid;place-items:center;
  background:linear-gradient(145deg,#7a68ff,#20c7b4);color:#fff;flex:none;
  box-shadow:0 12px 30px rgba(112,94,255,.3);position:relative;overflow:hidden;
}
.about-logo::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 50%)}
.about-logo svg{width:32px;height:32px;position:relative;z-index:1}
.about-hero h3{margin:0;font-size:17px;font-weight:700}
.about-hero p{margin:3px 0 0;font-size:10.5px;color:var(--muted);line-height:1.4}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:11px;overflow:hidden}
.spec{background:var(--surface-2);padding:9px 12px}
.spec span{font-size:8.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.spec b{display:block;font-size:10.5px;margin-top:3px;font-weight:600;line-height:1.35}

/* ---------- welcome ---------- */
.welcome-loading{
  width:100%;height:100%;padding:26px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  background:
    radial-gradient(120% 110% at 50% 0%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 62%),
    var(--surface);
}
.welcome-ring{position:relative;width:138px;height:138px;filter:drop-shadow(0 14px 30px rgba(70,60,190,.22))}
.welcome-ring svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.welcome-ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.welcome-ring .ring-track{stroke:var(--input)}
.welcome-ring .ring-fill{stroke:url(#welcomeRingGrad);transition:stroke-dashoffset .08s linear}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.ring-pct{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1}
.ring-center small{color:var(--accent);display:grid;place-items:center;opacity:.9}
.ring-center small svg{width:15px;height:15px}
.welcome-loading h2{font-size:20px;margin:19px 0 4px;letter-spacing:-.015em}
.welcome-loading p{font-size:11px;color:var(--muted);margin:0}
.welcome{
  width:100%;height:100%;padding:26px 28px;display:flex;flex-direction:column;
  background:
    radial-gradient(120% 110% at 95% 0%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 58%),
    var(--surface);
  min-width:0;
}
.welcome h1{font-size:23px;margin:17px 0 6px;letter-spacing:-.02em}
.welcome p{font-size:11.5px;color:var(--muted);line-height:1.6;margin:0 0 14px;max-width:390px}
.welcome .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-size:9.5px;padding:4px 8px;border-radius:99px;background:var(--input);border:1px solid var(--border);color:var(--muted);font-weight:500}
.welcome-tips{display:flex;flex-direction:column;width:100%;margin-bottom:6px}
.welcome-tip{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--border)}
.welcome-tip:last-child{border-bottom:1px solid var(--border)}
.welcome-tip .wt-ic{width:28px;height:28px;border-radius:8px;background:var(--input);border:1px solid var(--border);display:grid;place-items:center;color:var(--accent);flex:none}
.welcome-tip .wt-ic svg{width:14px;height:14px}
.welcome-tip b{font-size:10.5px;display:block;font-weight:600}
.welcome-tip p{margin:1px 0 0;font-size:10px;line-height:1.45;color:var(--muted);max-width:none}
.welcome .actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.welcome .foot{margin-top:12px;font-size:9px;color:var(--muted);opacity:.8}

/* ---------- responsive ---------- */
@media (max-width:900px){
  #appTitle{max-width:150px}
  .clock-date{display:none}
  .files-search{width:120px}
}
@media (max-width:760px){
  :root{--topbar-h:36px}
  #dock[data-pos="left"],#dock[data-pos="right"]{
    width:52px;padding:6px;gap:5px;border-radius:16px;
  }
  #dock[data-pos="left"]{left:8px}
  #dock[data-pos="right"]{right:8px}
  #dock[data-pos="top"],#dock[data-pos="bottom"]{
    padding:6px 7px;border-radius:16px;gap:5px;
  }
  #dock[data-pos="top"]{top:calc(var(--topbar-h) + 7px)}
  #dock[data-pos="bottom"]{bottom:8px}
  .dock-item{width:40px;height:40px}
  .dock-item .app-tile{width:36px;height:36px;border-radius:10px}
  .dock-item .app-tile svg{width:19px;height:19px}
  .dock-item .run-dot{display:none}
  #desktopIcons{display:none}
  #appTitle{display:none}
  .bar-left{flex:0}
  .bar-center{left:50%}
  #quickPanel{width:min(330px,calc(100vw - 16px));right:8px}
  #calendarPanel{width:min(352px,calc(100vw - 16px));right:8px}
  #overview{padding:52px 14px 100px}
  .ov-apps{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
  .ov-app .app-tile{width:48px;height:48px;border-radius:14px}
  .ov-app .app-tile svg{width:24px;height:24px}
  .ov-app{padding:13px 6px 11px}
  .files-side{width:144px}
  .set-side{width:154px}
  .set-main{padding:18px}
  .auth-time{font-size:52px}
  .auth-card{margin-top:9vh}
  .boot-name{font-size:21px}
  .mon-cards{grid-template-columns:1fr 1fr}
  .mon-cards .mon-card:last-child{display:none}
  .monitor-window .win-header{height:42px}
  #toasts{top:calc(var(--topbar-h) + 8px);right:8px}
}
@media (max-width:560px){
  .files-side{display:none}
  .set-side{width:52px;padding:13px 6px}
  .set-side-head{display:none}
  .set-nav{justify-content:center;padding:9px}
  .set-nav span{display:none}
  .set-main{padding:15px}
  .set-row{gap:10px}
  .set-slider{width:140px}
  .wall-grid{grid-template-columns:1fr 1fr}
  .lang-grid{grid-template-columns:1fr}
  .dock-pos button{width:29px}
  .ov-win{min-width:0;max-width:none;flex:1 1 100%}
  #calcWindow{width:100%}
  .auth-badge{display:none}
  .qs-grid{grid-template-columns:1fr 1fr}
}
@media (max-height:620px){
  .auth-top{top:4vh}
  .auth-time{font-size:46px}
  .auth-card{margin-top:2vh}
  .auth-avatar{width:68px;height:68px;font-size:21px}
  .auth-footer{bottom:12px}
}

/* ============================================================
   App context menu, dialogs and admin chrome
   ============================================================ */
#appCtx{min-width:248px}
.appctx-head{display:flex;align-items:center;gap:10px;padding:8px 9px 9px;min-width:0}
.appctx-head .app-tile{width:34px;height:34px;border-radius:9px;box-shadow:none}
.appctx-head .app-tile svg{width:17px;height:17px}
.appctx-meta{min-width:0}
.appctx-meta b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appctx-meta span{display:block;font-size:9.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-hint{margin-left:auto;font-size:8.5px;color:var(--muted);letter-spacing:.03em;flex:none}
.ctx-item.danger{color:var(--danger)}
.ctx-item.danger svg{color:var(--danger)}
.ctx-item.danger:hover{background:color-mix(in srgb,var(--danger) 12%,transparent)}
.ctx-item[aria-disabled="true"]{opacity:.42;pointer-events:none}

.toast .t-action{
  display:inline-flex;margin-top:6px;border:0;cursor:pointer;
  background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
  font:inherit;font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;
}
.toast .t-action:hover{background:color-mix(in srgb,var(--accent) 26%,transparent)}

/* ---------- modal dialogs ---------- */
.modal-layer{
  position:fixed;inset:0;z-index:500;display:grid;place-items:center;padding:24px;
  opacity:0;visibility:hidden;transition:opacity .16s,visibility .16s;
}
.modal-layer.open{opacity:1;visibility:visible}
.modal-scrim{
  position:absolute;inset:0;background:rgba(4,6,14,.62);
  backdrop-filter:blur(7px) saturate(1.1);-webkit-backdrop-filter:blur(7px) saturate(1.1);
}
.modal-card{
  position:relative;width:min(430px,100%);max-height:calc(100vh - 48px);overflow:auto;
  padding:24px;border-radius:18px;background:var(--surface-trans);color:var(--text);
  border:1px solid var(--border-strong);box-shadow:0 30px 90px rgba(0,0,0,.55);
  backdrop-filter:blur(30px) saturate(1.3);-webkit-backdrop-filter:blur(30px) saturate(1.3);
  transform:translateY(10px) scale(.98);transition:transform .18s cubic-bezier(.2,.8,.3,1);
  outline:none;
}
.modal-layer.open .modal-card{transform:none}
.modal-x{
  position:absolute;right:12px;top:12px;width:28px;height:28px;border:0;border-radius:8px;
  background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;
}
.modal-x:hover{background:var(--hover);color:var(--text)}
.modal-x svg{width:13px;height:13px}
.modal-icon{
  width:48px;height:48px;border-radius:14px;display:grid;place-items:center;
  margin-bottom:14px;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 16%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);
}
.modal-icon.warn{
  color:#e5a54b;background:color-mix(in srgb,#e5a54b 15%,transparent);
  border-color:color-mix(in srgb,#e5a54b 26%,transparent);
}
.modal-icon.ok{
  color:#30b57e;background:color-mix(in srgb,#30b57e 15%,transparent);
  border-color:color-mix(in srgb,#30b57e 26%,transparent);
}
.modal-title{margin:0;font-size:19px;font-weight:700;letter-spacing:-.015em;line-height:1.25}
.modal-desc{color:var(--muted);font-size:11.5px;line-height:1.55;margin:6px 0 0}
.modal-desc b{color:var(--text);font-weight:600}
.modal-field{display:block;margin-top:18px}
.modal-field span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin-bottom:6px}
.modal-field input{
  width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border-strong);
  background:var(--input);color:var(--text);font:inherit;font-size:12px;outline:none;user-select:text;
}
.modal-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.modal-note{font-size:10px;color:var(--muted);line-height:1.5;margin-top:12px;padding:8px 10px;border-radius:8px;background:var(--input)}
.modal-note.error{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.modal-actions .btn{font-size:11px;padding:8px 13px}
.modal-app-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.modal-app-head .app-tile{width:38px;height:38px;border-radius:10px;box-shadow:none}
.modal-app-head h3{margin:0;font-size:14px;font-weight:700}
.modal-app-head p{margin:2px 0 0;font-size:10px;color:var(--muted)}

/* share sheet */
.share-list{display:flex;flex-direction:column;gap:3px;margin-top:15px}
.share-row{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;cursor:pointer;
  border:1px solid transparent;border-radius:9px;background:none;color:var(--text);
  text-align:left;font:inherit;
}
.share-row:hover{background:var(--hover);border-color:var(--border)}
.share-row .s-ic{
  width:32px;height:32px;border-radius:9px;background:var(--surface-3);
  display:grid;place-items:center;color:var(--muted);flex:none;
}
.share-row:hover .s-ic{color:var(--text)}
.share-row .s-info{flex:1;min-width:0}
.share-row b{display:block;font-size:11.5px;font-weight:600}
.share-row small{display:block;font-size:9.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.share-row > svg{color:var(--muted);width:13px;height:13px;flex:none}

/* phone handoff */
.phone-stage{
  display:flex;align-items:center;gap:16px;margin-top:16px;padding:14px;
  border:1px solid var(--border);border-radius:13px;background:var(--surface-2);
}
.qr-wrap{width:126px;height:126px;flex:none;padding:9px;border-radius:10px;background:#fff;box-shadow:0 8px 22px rgba(0,0,0,.18)}
.qr-wrap svg{width:100%;height:100%;display:block}
.device-info{min-width:0;flex:1}
.device-row{display:flex;align-items:center;gap:9px}
.device-ic{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
}
.device-info b{display:block;font-size:12px;font-weight:600}
.device-info small{display:block;font-size:9.5px;color:var(--muted);margin-top:1px}
.device-status{
  display:inline-flex;align-items:center;gap:4px;margin-left:auto;
  font-size:8.5px;font-weight:700;letter-spacing:.04em;color:#30b57e;
}
.device-status::before{content:"";width:5px;height:5px;border-radius:50%;background:#30b57e;box-shadow:0 0 7px #30b57e}
.device-link{
  margin-top:10px;padding:5px 7px;border-radius:5px;background:var(--input);
  font-family:var(--mono);font-size:9.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sent-card{display:flex;align-items:center;gap:10px;margin-top:15px;padding:11px;border:1px solid var(--border);border-radius:11px;background:var(--surface-2)}
.sent-card .app-tile{width:34px;height:34px;border-radius:9px;box-shadow:none}
.sent-card .sent-meta{flex:1;min-width:0}
.sent-card b{display:block;font-size:11.5px}
.sent-card small{display:block;font-size:9.5px;color:var(--muted);margin-top:1px}
.sent-badge{
  margin-left:auto;font-size:8.5px;font-weight:800;letter-spacing:.05em;
  color:#30b57e;background:color-mix(in srgb,#30b57e 14%,transparent);
  padding:3px 6px;border-radius:5px;flex:none;
}

/* properties */
.prop-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:1px;overflow:hidden;
  background:var(--border);border:1px solid var(--border);border-radius:11px;margin-top:4px;
}
.prop-row{background:var(--surface-2);padding:9px 11px;min-width:0}
.prop-row span{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.prop-row b{display:block;font-size:10.5px;margin-top:3px;font-weight:600;line-height:1.35;word-break:break-word}

/* admin window badge */
.admin-chip{
  flex:none;font-size:8px;font-weight:800;letter-spacing:.08em;line-height:1.2;
  padding:2px 5px;border-radius:5px;color:#e5a54b;
  background:color-mix(in srgb,#e5a54b 16%,transparent);
  border:1px solid color-mix(in srgb,#e5a54b 28%,transparent);
}

@media (max-width:560px){
  .modal-layer{padding:12px}
  .modal-card{padding:20px;max-height:calc(100vh - 24px)}
  .phone-stage{flex-direction:column;align-items:stretch}
  .qr-wrap{align-self:center}
  .prop-grid{grid-template-columns:1fr}
  #appCtx{min-width:230px;max-width:calc(100vw - 20px)}
}

  const moShort = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'].map(localize);
  const moLong = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'].map(localize);

function timeAgo(ts) {

  if (sec < 86400) return `${Math.round(sec / 3600)}h ago`;
  return `${Math.round(sec / 86400)}d ago`;
}

/* ---------- window manager ---------- */
let winSeq = 0;
let dragState = null;

function dockInsets() {
  const mobile = window.innerWidth < 760;
  const pos = DOCK_POSITIONS.includes(S.dockPosition) ? S.dockPosition : 'left';
  return {
    left: mobile ? (pos === 'left' ? 62 : 8) : 88,
    right: pos === 'right' ? (mobile ? 62 : 86) : 8,
    top: pos === 'top' ? (mobile ? 104 : 118) : 42,
    bottom: pos === 'bottom' ? (mobile ? 70 : 84) : (mobile ? 12 : 10)
  };
}
function maxBounds() {
  const ins = dockInsets();
  return {
    left: ins.left, top: ins.top,
    width: Math.max(280, window.innerWidth - ins.left - ins.right),
    height: Math.max(220, window.innerHeight - ins.top - ins.bottom)
  };
}
function viewportBounds() {
  return { left: 8, top: 42, right: window.innerWidth - 8, bottom: window.innerHeight - 10 };
}
function getWinBounds(win) {
  return { left: parseFloat(win.el.style.left) || 0, top: parseFloat(win.el.style.top) || 0, width: parseFloat(win.el.style.width) || 400, height: parseFloat(win.el.style.height) || 300 };
}
function setBounds(win, b, animate = false) {
  if (animate) {
    win.el.classList.add('animating');
    clearTimeout(win.animTimer);
    win.animTimer = setTimeout(() => win.el.classList.remove('animating'), 260);
  }
  win.el.style.left = `${Math.round(b.left)}px`;
  win.el.style.top = `${Math.round(b.top)}px`;
  win.el.style.width = `${Math.round(b.width)}px`;
  win.el.style.height = `${Math.round(b.height)}px`;
}

function openApp(id, opts = {}) {
  const app = APPS[id];
  if (!app) return null;
  if (state.view !== 'desktop') return null;

  if (openWindows.has(id)) {
    const existing = openWindows.get(id);
    if (existing.minimized) restoreWin(existing);
    focusWin(existing);
    return existing;
  }

  const mobile = window.innerWidth < 760;
  const [dw, dh] = app.size;
  const ins = dockInsets();
  const width = Math.min(dw, window.innerWidth - ins.left - ins.right);
  const height = Math.min(dh, window.innerHeight - ins.top - ins.bottom);
  const offset = (state.cascade++ % 5) * 22;
  let left = ins.left + (window.innerWidth - ins.left - ins.right - width) / 2 + offset - 44;
  let top = ins.top + (window.innerHeight - ins.top - ins.bottom - height) / 2 + offset - 44;
  left = clamp(left, ins.left, Math.max(ins.left, window.innerWidth - width - ins.right));
  top = clamp(top, ins.top, Math.max(ins.top, window.innerHeight - height - ins.bottom));

  const el = document.createElement('div');
  el.className = 'window';
  el.dataset.winId = `win-${++winSeq}`;
  el.innerHTML = `
    <div class="win-header">
      <div class="win-title">${appTile(id)}<span class="win-title-text">${esc(appName(id))}</span></div>
      <div class="win-controls">
        <button class="win-btn" data-act="min" aria-label="Minimize" title="Minimize">${icon('minus', 12, 2.2)}</button>
        <button class="win-btn" data-act="max" aria-label="Maximize" title="Maximize">${icon('maximize', 11, 1.9)}</button>
        <button class="win-btn close" data-act="close" aria-label="Close" title="Close">${icon('close', 11, 2.2)}</button>
      </div>
    </div>
    <div class="win-body"></div>
    <div class="resize-handle" title="Resize"></div>`;
  const win = {
    id: `win-${winSeq}`, appId: id, appName: appName(id), title: appName(id),
    el, minimized: false, maximized: false, prevBounds: null, cleanup: null, loadFile: null, admin: false
  };
  el.style.left = `${Math.round(left)}px`;
  el.style.top = `${Math.round(top)}px`;
  el.style.width = `${Math.round(width)}px`;
  el.style.height = `${Math.round(height)}px`;
  el.style.zIndex = String(++zTop);
  $('#windows').appendChild(el);
  el.addEventListener('pointerdown', () => focusWin(win), true);

  win.titleEl = $('.win-title-text', el);
  win.body = $('.win-body', el);
  win.maxBtn = $('[data-act="max"]', el);

  $$('.win-controls .win-btn', el).forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const act = btn.dataset.act;
      if (act === 'min') minimizeWin(win);
      else if (act === 'max') toggleMax(win);
      else closeWin(win);
    });
  });
  setupDrag(win);
  setupResize(win);

  const cleanup = mountApp(id, win.body, win, opts);
  if (typeof cleanup === 'function') win.cleanup = cleanup;

  openWindows.set(id, win);
  focusWin(win);
  if (mobile) toggleMax(win, true);
  syncDock();
  refreshOverview();
  return win;
}

function mountApp(id, body, win, opts) {
  switch (id) {
    case 'files': return mountFiles(body, win, opts);
    case 'terminal': return mountTerminal(body, win, opts);
    case 'editor': return mountEditor(body, win, opts);
    case 'calculator': return mountCalculator(body, win, opts);
    case 'monitor': return mountMonitor(body, win, opts);
    case 'settings': return mountSettings(body, win, opts);
    case 'welcome': return mountWelcome(body, win, opts);
    default: body.innerHTML = '<div style="padding:20px">Not available</div>';
  }
}

function focusWin(win, noRaise = false) {
  if (!win) return;
  if (win.minimized) restoreWin(win);
  if (state.focused === win.id && !noRaise) {
    updateAppTitle();
    syncDock();
    return;
  }
  state.focused = win.id;
  if (!noRaise) win.el.style.zIndex = String(++zTop);
  openWindows.forEach((w) => w.el.classList.toggle('focused', w.id === win.id));
  updateAppTitle();
  syncDock();
}
function restoreWin(win) {
  if (!win) return;
  win.minimized = false;
  win.el.classList.remove('minimized');
}
function minimizeWin(win) {
  if (!win || win.minimized) return;
  win.minimized = true;
  win.el.classList.add('minimized');
  if (state.focused === win.id) {
    state.focused = null;
    focusTopWindow();
  }
  syncDock();
  updateAppTitle();
  refreshOverview();
}
function focusTopWindow() {
  const list = Array.from(openWindows.values()).filter((w) => !w.minimized);
  if (!list.length) {
    state.focused = null;
    openWindows.forEach((w) => w.el.classList.remove('focused'));
    updateAppTitle();
    syncDock();
    return;
  }
  list.sort((a, b) => Number(a.el.style.zIndex) - Number(b.el.style.zIndex));
  focusWin(list[list.length - 1], true);
}
function closeWin(win) {
  if (!win) return;
  const wasFocused = state.focused === win.id;
  openWindows.delete(win.appId);
  if (typeof win.cleanup === 'function') {
    try { win.cleanup(); } catch (e) { /* ignore */ }
  }
  win.el.classList.add('closing');
  setTimeout(() => win.el.remove(), 170);
  if (wasFocused) {
    state.focused = null;
    focusTopWindow();
  }
  syncDock();
  updateAppTitle();
  refreshOverview();
}
function setWinTitle(win, text) {
  win.title = text;
  if (win.titleEl) win.titleEl.textContent = text;
  updateAppTitle();
}
function toggleMax(win, initial = false) {
  if (!win) return;
  if (!win.maximized) {
    win.prevBounds = getWinBounds(win);
    win.maximized = true;
    win.el.classList.add('maximized');
    setBounds(win, maxBounds(), !initial);
    if (win.maxBtn) {
      win.maxBtn.innerHTML = icon('restore', 11, 1.9);
      win.maxBtn.title = 'Restore';
      win.maxBtn.setAttribute('aria-label', 'Restore');
    }
  } else {
    win.maximized = false;
    win.el.classList.remove('maximized');
    const b = win.prevBounds || { left: 120, top: 80, width: 760, height: 500 };
    setBounds(win, b, true);
    if (win.maxBtn) {
      win.maxBtn.innerHTML = icon('maximize', 11, 1.9);
      win.maxBtn.title = 'Maximize';
      win.maxBtn.setAttribute('aria-label', 'Maximize');
    }
  }
  focusWin(win);
}
function setupDrag(win) {
  const header = $('.win-header', win.el);
  if (!header) return;
  header.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    if (e.target.closest('.win-controls')) return;
    focusWin(win);
    if (win.maximized) return;
    e.preventDefault();
    const start = getWinBounds(win);
    dragState = { win, startX: e.clientX, startY: e.clientY, ...start };
    document.body.classList.add('dragging');
    header.setPointerCapture(e.pointerId);
    const move = (ev) => {
      if (!dragState) return;
      const dx = ev.clientX - dragState.startX;
      const dy = ev.clientY - dragState.startY;
      const maxLeft = window.innerWidth - 120;
      const left = clamp(dragState.left + dx, 8 - dragState.width + 140, maxLeft);
      const top = clamp(dragState.top + dy, 38, window.innerHeight - 52);
      win.el.style.left = `${Math.round(left)}px`;
      win.el.style.top = `${Math.round(top)}px`;
    };
    const up = () => {
      dragState = null;
      document.body.classList.remove('dragging');
      header.removeEventListener('pointermove', move);
      header.removeEventListener('pointerup', up);
      header.removeEventListener('pointercancel', up);
    };
    header.addEventListener('pointermove', move);
    header.addEventListener('pointerup', up);
    header.addEventListener('pointercancel', up);
  });
  header.addEventListener('dblclick', (e) => {
    if (e.target.closest('.win-controls')) return;
    toggleMax(win);
  });
}
function setupResize(win) {
  const handle = $('.resize-handle', win.el);
  if (!handle) return;
  handle.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.stopPropagation();
    e.preventDefault();
    focusWin(win);
    if (win.maximized) return;
    const start = getWinBounds(win);
    const sx = e.clientX;
    const sy = e.clientY;
    handle.setPointerCapture(e.pointerId);
    const move = (ev) => {
      const width = clamp(start.width + ev.clientX - sx, 300, window.innerWidth - start.left - 8);
      const height = clamp(start.height + ev.clientY - sy, 220, window.innerHeight - start.top - 8);
      win.el.style.width = `${Math.round(width)}px`;
      win.el.style.height = `${Math.round(height)}px`;
    };
    const up = () => {
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', up);
      handle.removeEventListener('pointercancel', up);
    };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
    handle.addEventListener('pointercancel', up);
  });
}

window.addEventListener('resize', () => {
  openWindows.forEach((win) => {
    if (win.maximized) {
      setBounds(win, maxBounds());
    } else {
      const b = getWinBounds(win);
      if (b.left > window.innerWidth - 120) win.el.style.left = `${window.innerWidth - 160}px`;
      if (b.top > window.innerHeight - 52) win.el.style.top = `${window.innerHeight - 80}px`;
      if (b.width > window.innerWidth - 16) win.el.style.width = `${window.innerWidth - 16}px`;
      if (b.height > window.innerHeight - 52) win.el.style.height = `${window.innerHeight - 60}px`;
    }
  });
});

/* ---------- overview ---------- */
function buildOverview() {
  const grid = $('#ovApps');
  if (!grid) return;
  grid.innerHTML = Object.entries(APPS)
    .filter(([id]) => isAppVisible(id))
    .map(([id]) => `<button class="ov-app" data-app="${id}">${appTile(id)}<span>${esc(appName(id))}</span></button>`)
    .join('');
  grid.addEventListener('click', (e) => {
    const btn = e.target.closest('.ov-app');
    if (!btn) return;
    closeOverview();
    openApp(btn.dataset.app);
  });

  const search = $('#ovSearch');
  search.addEventListener('input', () => filterOverview(search.value.trim().toLowerCase()));
  search.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const first = $$('#ovApps .ov-app').find((b) => !b.hidden);
      if (first) { closeOverview(); openApp(first.dataset.app); }
    }
    e.stopPropagation();
  });

  const host = $('#ovWindows');
  host.addEventListener('click', (e) => {
    const close = e.target.closest('.ov-win-close');
    const card = e.target.closest('.ov-win');
    if (!card) return;
    if (close) {
      const win = openWindows.get(card.dataset.app);
      if (win) closeWin(win);
      updateOverviewWindows();
      return;
    }
    const win = openWindows.get(card.dataset.app);
    if (win) {
      closeOverview();
      restoreWin(win);
      focusWin(win);
    }
  });

  $('#overview').addEventListener('click', (e) => {
    if (e.target.closest('.ov-app,.ov-win,.ov-search,button,input')) return;
    closeOverview();
  });
}
function filterOverview(q) {
  let visible = 0;
  $$('#ovApps .ov-app').forEach((b) => {
    const rawName = appName(b.dataset.app);
    const name = rawName.toLowerCase();
    const localName = (typeof tr === 'function' ? tr(rawName) : rawName).toLowerCase();
    const show = isAppVisible(b.dataset.app) && (!q || name.includes(q) || localName.includes(q) || b.dataset.app.includes(q));
    b.hidden = !show;
    if (show) visible++;
  });
  const empty = $('#ovEmpty');
  if (empty) empty.hidden = visible !== 0;
}
function updateOverviewWindows() {
  const host = $('#ovWindows');
  const label = $('#ovWinLabel');
  if (!host || !label) return;
  const wins = Array.from(openWindows.values());
  label.hidden = wins.length === 0;
  host.innerHTML = wins.map((w) => `
    <div class="ov-win" data-app="${w.appId}">
      ${appTile(w.appId)}
      <span class="ov-win-name">${esc(w.title)}</span>
      <button class="ov-win-close" aria-label="Close window">${icon('close', 11, 2.2)}</button>
    </div>`).join('');
}
function openOverview() {

  document.body.classList.add('overview-open');

  updateOverviewWindows();
  const search = $('#ovSearch');
  search.value = '';
  filterOverview('');
  setTimeout(() => search.focus(), 120);
}
function closeOverview() {
  if (!state.overview) return;
  state.overview = false;
  document.body.classList.remove('overview-open');

function refreshOverview() {

}
